<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewing Gallery // Catch Up | Wrestle Lore (prototype)</title>
<meta name="description" content="Spoiler-safe weekly catch-up hub for WWE, AEW, TNA and NXT. Prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS (mirror of css/site.css :root, for prototype only)
   ============================================================ */
:root{
  --c-bg:#0a0b0d; --c-bg-elev-1:#121418; --c-bg-elev-2:#1a1d23; --c-bg-elev-3:#23272f;
  --c-line:#2b3038; --c-line-strong:#3a414c;
  --c-text:#e8eaed; --c-text-muted:#a2a9b4; --c-text-dim:#6b727d;
  --c-gold:#d4af37; --c-gold-bright:#f2cc4b; --c-gold-dim:#8c7420; --c-gold-tint:rgba(212,175,55,.12);
  --c-red:#e11d2a; --c-red-bright:#ff3b48; --c-red-dim:#8f1219; --c-red-tint:rgba(225,29,42,.12);
  --c-focus:#5aa9ff; --c-wwe:#c8102e; --c-nxt:#f5c518; --c-aew:#c8a24a; --c-tna:#1e73be;
  --fs-300:clamp(.78rem,.74rem + .20vw,.875rem);
  --fs-400:clamp(.94rem,.90rem + .25vw,1.05rem);
  --fs-500:clamp(1.13rem,1.05rem + .40vw,1.35rem);
  --fs-700:clamp(1.65rem,1.35rem + 1.50vw,2.55rem);
  --fs-800:clamp(2.05rem,1.55rem + 2.60vw,3.60rem);
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2rem; --sp-7:3rem;
  --r-sm:4px; --r-md:8px; --r-lg:14px; --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --font-cond:"Oswald","Arial Narrow",system-ui,sans-serif;
  --font-disp:"Anton","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body);
  font-size:var(--fs-400);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:var(--c-gold-bright);text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px;border-radius:var(--r-sm);}
.wrap{width:min(1180px,92vw);margin-inline:auto;}
.section{padding-block:var(--sp-6);}
.eyebrow{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.12em;
  color:var(--c-gold);font-size:var(--fs-300);font-weight:700;margin:0;}
.rule-gold{height:2px;border:0;width:min(120px,32%);margin:var(--sp-3) 0 0;
  background:linear-gradient(90deg,var(--c-gold),transparent);}
.telemetry{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.18em;
  font-size:9px;color:var(--c-text-dim);display:inline-flex;align-items:center;gap:.5em;}
.telemetry::before{content:"";width:.5em;height:.5em;background:var(--c-red);border-radius:1px;flex:0 0 auto;}
.telemetry b{color:var(--c-gold);font-weight:600;}
.telemetry--nom::before{display:none;}
.link-more{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;
  font-size:var(--fs-300);font-weight:600;color:var(--c-text-muted);text-decoration:none;white-space:nowrap;}
.link-more:hover{color:var(--c-gold);}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.5em;padding:0;margin:0 0 var(--sp-3);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-text-dim);}
.crumbs li+li::before{content:"/";margin-right:.5em;color:var(--c-line-strong);}
.crumbs a{color:var(--c-text-muted);text-decoration:none;}
.crumbs a:hover{color:var(--c-gold);}

/* ---- corner brackets utility ---- */
.brackets{position:relative;}
.brackets::before,.brackets::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;}
.brackets::before{top:6px;left:6px;border-top:1px solid var(--c-gold-dim);border-left:1px solid var(--c-gold-dim);}
.brackets::after{bottom:6px;right:6px;border-bottom:1px solid var(--c-gold-dim);border-right:1px solid var(--c-gold-dim);}

/* ============================================================
   WEEK SWITCHER (reuse .lf-weekbar), sticky wrapper (.vg-weekbar-stick)
   ============================================================ */
.vg-weekbar-stick{position:sticky;top:42px;z-index:40;
  background:color-mix(in srgb,var(--c-bg) 88%,transparent);backdrop-filter:blur(10px);}
.lf-weekbar{display:flex;align-items:center;gap:8px;margin:0;padding:10px 0;
  border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);}
.lf-wb__nav{flex:0 0 auto;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-gold);border:1px solid var(--c-line-strong);border-radius:2px;
  padding:6px 10px;white-space:nowrap;background:none;cursor:pointer;}
.lf-wb__nav:hover{color:var(--c-gold-bright);border-color:var(--c-gold-dim);}
.lf-wb__nav.is-off{color:var(--c-text-dim);border-color:var(--c-line);opacity:.5;pointer-events:none;}
.lf-wb__track{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.lf-wb__track::-webkit-scrollbar{display:none;}
.lf-wb__wk{flex:0 0 auto;font-family:var(--font-cond);font-weight:600;font-size:.8rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--c-text-muted);border:1px solid var(--c-line);border-radius:2px;
  padding:5px 12px;white-space:nowrap;background:none;cursor:pointer;transition:border-color .15s,color .15s;}
.lf-wb__wk:hover{color:#fff;border-color:var(--c-line-strong);}
.lf-wb__wk.is-cur{color:#000;background:var(--c-gold);border-color:var(--c-gold);font-weight:700;}
.lf-wb__live{display:inline-block;margin-left:.5em;font-family:var(--font-mono);font-size:8px;
  letter-spacing:.14em;color:var(--c-red-bright);vertical-align:middle;}
@media (max-width:600px){.vg-weekbar-stick{position:static;}}

/* ============================================================
   SPOTLIGHT HERO (.vg-spot, adapts .media-hero / .mh-*)
   ============================================================ */
.vg-spot{padding-block:var(--sp-6) var(--sp-5);}
.mh-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-6);align-items:center;}
@media (min-width:920px){.mh-grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:var(--sp-7);}}
.mh-copy{min-width:0;}
.vg-spot__h{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;
  font-size:var(--fs-800);line-height:.94;letter-spacing:.01em;margin:.15em 0 0;}
.ev-lede{color:var(--c-text-muted);max-width:56ch;margin:var(--sp-4) 0 0;}
.vg-spot__reassure{margin:var(--sp-3) 0 0;font-size:var(--fs-300);color:var(--c-text-dim);max-width:56ch;}
.vg-spot__meta{margin-top:var(--sp-4);}
.mh-feature{position:relative;min-width:0;border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);
  padding:calc(var(--sp-3) + 4px);background:var(--c-bg-elev-1);}
.mh-feature .yt{border-radius:calc(var(--r-lg) - 4px);overflow:hidden;border:1px solid var(--c-line);}
.mh-tag{position:absolute;z-index:6;top:calc(var(--sp-3) + 10px);left:calc(var(--sp-3) + 10px);
  display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text);background:rgba(10,11,13,.72);
  border:1px solid var(--c-line-strong);border-radius:var(--r-pill);padding:.4em .8em;backdrop-filter:blur(4px);}
.mh-tag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--c-red);
  box-shadow:0 0 0 3px var(--c-red-tint);}
.mh-cap{padding:var(--sp-3) var(--sp-2) var(--sp-2);}
.mh-k{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--c-text-dim);}
.mh-ft{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;line-height:.95;
  font-size:var(--fs-700);margin:.1em 0 .15em;}
.mh-sub{display:block;font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.04em;
  font-size:var(--fs-400);color:var(--c-text-muted);}
.mh-sub b{color:var(--c-gold);font-weight:600;}
.mh-hint{margin-top:var(--sp-2);display:inline-flex;align-items:center;gap:.5em;
  font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-size:var(--fs-300);color:var(--c-text-muted);}
.mh-hint svg{width:15px;height:15px;fill:var(--c-red-bright);}

/* ============================================================
   COMMAND DECK (.vg-deck) — caught-up meter + shuffle + spoiler toggle + continue
   ============================================================ */
.vg-deck{display:grid;gap:var(--sp-4);grid-template-columns:1fr;padding:var(--sp-4) var(--sp-5) var(--sp-5);
  border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-bg-elev-1);margin-top:var(--sp-4);}
@media (min-width:820px){.vg-deck{grid-template-columns:1.6fr 1fr;align-items:center;}}
.vg-meter__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;}
.vg-meter__read{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold);}
.vg-segs{display:flex;gap:6px;margin-top:var(--sp-3);}
.vg-seg{flex:1;height:10px;border:1px solid var(--c-gold-dim);border-radius:2px;background:transparent;
  position:relative;overflow:hidden;}
.vg-seg::after{content:"";position:absolute;inset:0;background:var(--c-gold);transform:scaleX(0);
  transform-origin:left;transition:transform .35s var(--ease);}
.vg-seg.is-on::after{transform:scaleX(1);}
.vg-meter__note{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-text-dim);margin-top:var(--sp-2);}
.vg-meter.is-done .vg-meter__read{color:var(--c-gold-bright);}
.vg-deck__actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;justify-content:flex-start;}
@media (min-width:820px){.vg-deck__actions{justify-content:flex-end;}}
.vg-btn{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  font-size:var(--fs-300);color:var(--c-gold);background:none;border:1px solid var(--c-gold-dim);
  border-radius:2px;padding:.6em 1em;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;
  transition:border-color .15s,color .15s,background .15s;}
.vg-btn:hover{color:var(--c-gold-bright);border-color:var(--c-gold);background:var(--c-gold-tint);}
.vg-btn svg{width:15px;height:15px;fill:currentColor;}
.vg-toggle[aria-pressed="true"]{color:var(--c-red-bright);border-color:var(--c-red-dim);}
.vg-continue{grid-column:1/-1;display:none;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding-top:var(--sp-3);border-top:1px solid var(--c-line);}
.vg-continue.is-on{display:flex;}
.vg-continue a{color:var(--c-gold-bright);text-decoration:none;font-family:var(--font-cond);
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;}

/* ---- PLE countdown band (.vg-clock) ---- */
.vg-clock{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;
  margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-5);border:1px solid var(--c-gold-dim);
  border-radius:var(--r-lg);background:var(--c-bg-elev-1);}
.vg-clock__lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-muted);}
.vg-clock__lbl b{color:var(--c-gold);}
.vg-clock__t{font-family:var(--font-disp);font-size:var(--fs-700);letter-spacing:.06em;color:var(--c-text);}
.vg-clock__t .u{color:var(--c-text-dim);font-size:.5em;font-family:var(--font-mono);letter-spacing:.1em;}
.vg-clock.is-live .vg-clock__t{color:var(--c-red-bright);}

/* ============================================================
   HORIZONTAL ROWS (.vg-row → reuse .tw-rail scroller)
   ============================================================ */
.vg-row{padding-block:var(--sp-5);}
.vg-row__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-4);}
.vg-row__h{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;
  font-size:var(--fs-700);line-height:1;margin:0 0 .25em;}
.vg-row__sub{display:block;}
.tw-rail{display:flex;gap:var(--sp-4);overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;padding:0 0 .6rem;list-style:none;margin:0;scrollbar-width:thin;
  scrollbar-color:var(--c-gold-dim) transparent;
  background:linear-gradient(270deg,rgba(242,204,75,.16),transparent 30px) right center/30px 82% no-repeat;}
.tw-rail>li{flex:0 0 clamp(220px,64%,270px);scroll-snap-align:start;}
.tw-rail::-webkit-scrollbar{height:6px;}
.tw-rail::-webkit-scrollbar-thumb{background:var(--c-gold-dim);border-radius:99px;}
.tw-rail::-webkit-scrollbar-track{background:transparent;}
.vg-row--ple .vg-row__h{color:var(--c-text);}

/* ---- vcard (reused) ---- */
.vcard{background:var(--c-bg-elev-1);border:1px solid var(--c-line);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;height:100%;position:relative;
  transition:border-color .18s,transform .18s;}
.vcard:hover{border-color:var(--c-line-strong);transform:translateY(-3px);}
.vcard__body{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);flex:1;}
.vcard__title{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.01em;font-weight:600;
  font-size:var(--fs-500);line-height:1.1;margin:0;color:var(--c-text);}
.vcard__meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;margin-top:auto;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-dim);}
.vcard__flag{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-red-bright);border:1px solid var(--c-red-dim);border-radius:2px;padding:.15em .5em;}
/* seen state */
.vg-card--seen{border-color:var(--c-gold-dim);}
.vg-card--seen .yt__thumb{filter:brightness(.45) saturate(.6);}
.vg-card--seen .vcard__body::before{content:"";}
.vg-seen-tick{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:7;width:22px;height:22px;
  display:none;place-content:center;border-radius:50%;background:var(--c-gold);color:#000;}
.vg-card--seen .vg-seen-tick{display:grid;}
.vg-seen-tick svg{width:13px;height:13px;fill:#000;}

/* ---- .yt facade (reused, spoiler-blurred under .thisweek) ---- */
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000;border:0;padding:0;cursor:pointer;}
.yt__thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.yt__play{position:absolute;inset:0;margin:auto;width:64px;height:44px;display:grid;place-content:center;
  background:rgba(10,11,13,.66);border:1px solid var(--c-line-strong);border-radius:12px;
  transition:transform .18s,background .18s;pointer-events:none;}
.yt__play svg{width:24px;height:24px;fill:#fff;}
.yt:hover .yt__play,.yt:focus-visible .yt__play{transform:scale(1.08);background:var(--c-red-bright);border-color:var(--c-red-bright);}
.yt__cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:var(--sp-4) var(--sp-3) var(--sp-2);
  background:linear-gradient(0deg,rgba(10,11,13,.85),transparent);
  font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-300);
  color:#fff;text-align:left;pointer-events:none;}
/* spoiler blur */
.thisweek .yt__thumb{filter:blur(16px) brightness(.55);transform:scale(1.06);
  transition:filter .35s var(--ease),transform .35s var(--ease);}
.thisweek .yt:hover .yt__thumb,.thisweek .yt:focus-visible .yt__thumb{filter:none;transform:none;}
.thisweek.is-spoilers-shown .yt__thumb{filter:none;transform:none;}
@media (prefers-reduced-motion:reduce){.thisweek .yt__thumb,.vg-seg::after{transition:none;}}

/* ---- UP NEXT strip (.vg-upnext) ---- */
.vg-upnext{margin-top:var(--sp-5);padding:var(--sp-5);border:1px dashed var(--c-line-strong);border-radius:var(--r-lg);}
.vg-upnext__list{list-style:none;display:flex;flex-wrap:wrap;gap:var(--sp-3);padding:0;margin:var(--sp-3) 0;}
.vg-upnext__list li{display:flex;flex-direction:column;gap:.1em;padding:.6em .9em;border:1px solid var(--c-line);
  border-radius:var(--r-md);background:var(--c-bg-elev-1);min-width:118px;}
.vg-upnext__list b{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;color:var(--c-text);font-size:var(--fs-400);}
.vg-upnext__list span{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-text-dim);}
.vg-upnext__note{margin:var(--sp-2) 0 0;color:var(--c-text-muted);font-size:var(--fs-300);}

/* ---- PLE event card (.vg-ple-card) ---- */
.vg-ple-card{display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp-3);height:100%;
  padding:var(--sp-4);border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);background:var(--c-bg-elev-2);}
.vg-ple-card__nm{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;font-size:var(--fs-700);line-height:.95;margin:.1em 0;}
.vg-ple-card__cnt{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold-bright);}
.vg-ple-card__go{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  font-size:var(--fs-300);color:var(--c-gold);border:1px solid var(--c-gold-dim);border-radius:2px;
  padding:.5em .9em;text-decoration:none;align-self:flex-start;}
.vg-ple-card__go:hover{color:var(--c-gold-bright);border-color:var(--c-gold);}

/* ============================================================
   FULL GRID (demoted .tw-layout master-detail)
   ============================================================ */
.vg-fullgrid{margin-top:var(--sp-6);padding-top:var(--sp-6);border-top:1px solid var(--c-line);}
.tw-layout{display:grid;grid-template-columns:minmax(210px,260px) 1fr;gap:var(--sp-5);align-items:start;margin-top:var(--sp-4);}
.tw-list{display:flex;flex-direction:column;gap:.6rem;}
.tw-item{text-align:left;display:flex;flex-direction:column;gap:.15rem;padding:.9rem 1.05rem;
  background:var(--c-bg-elev-1);border:1px solid var(--c-line);border-radius:var(--r-md);cursor:pointer;
  transition:border-color .18s,background .18s;}
.tw-item:hover{border-color:var(--c-line-strong);}
.tw-item[aria-selected="true"]{border-color:var(--c-gold-bright);background:var(--c-bg-elev-2);}
.tw-item__name{font-family:var(--font-disp);font-size:var(--fs-500);letter-spacing:.02em;color:var(--c-text);text-transform:uppercase;line-height:1.1;}
.tw-item__net{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--c-text-dim);text-transform:uppercase;}
.tw-panel[hidden]{display:none;}
.tw-panel__head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:var(--sp-3);flex-wrap:wrap;}
.tw-net{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--c-gold-bright);text-decoration:none;
  border:1px solid var(--c-line-strong);padding:.42em .85em;border-radius:var(--r-pill);white-space:nowrap;}
.tw-net:hover{border-color:var(--c-gold-bright);background:var(--c-gold-tint);}
@media (max-width:760px){.tw-layout{grid-template-columns:1fr;}.tw-list{flex-direction:row;overflow-x:auto;}}

/* ---- Insider (single gold CTA fill on the page) ---- */
.vg-insider{margin-top:var(--sp-6);padding:var(--sp-6);border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);
  background:var(--c-bg-elev-1);}
.vg-insider h2{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-500);margin:.2em 0;}
.vg-insider p{color:var(--c-text-muted);max-width:60ch;margin:0 0 var(--sp-4);}
.vg-insider form{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;}

    html+='<section class="vg-spot" aria-label="This week\'s spotlight"><div class="mh-grid">'+
      '<div class="mh-copy">'+
        '<p class="eyebrow">The Week // Catch Up</p>'+
        '<h1 class="vg-spot__h">'+esc(wk.label)+'</h1><hr class="rule-gold">'+
        '<p class="ev-lede">'+lede+'</p>'+
        '<p class="vg-spot__reassure">Every show from this week in one place, newest first. Tap Spoilers to hide results if you are catching up late.</p>'+
        '<span class="telemetry vg-spot__meta"><b>'+shows.length+' SHOWS IN'+(partial?" // "+pending.length+" STILL TO AIR":"")+'</b></span>'+
      '</div>'+
      '<div class="mh-feature brackets">'+
        '<span class="mh-tag">'+esc(tag)+'</span>'+
        '<button class="yt" type="button" data-play data-id="'+spot.id+'" data-title="'+esc(vtitle(spot))+'" data-page="'+pageUrl(spot.promo,spot.label,spot.date)+'" aria-label="Play the weekly spotlight, opens spoiler-safe player">'+
          '<img class="yt__thumb" src="'+thumb(spot.id)+'" alt="" decoding="async" width="480" height="270">'+
          '<span class="yt__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>'+
        '</button>'+
        '<div class="mh-cap"><span class="mh-k">Featured this week</span>'+
          '<p class="mh-ft">'+esc(showFull(spot.show))+'</p>'+
          '<span class="mh-sub">'+esc(descOf(spot.label))+' &middot; <b>'+esc(netOf(spot.show))+'</b> &middot; '+dayShort(spot.date)+'</span>'+
          '<span class="mh-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Press play to watch here, spoiler-safe</span>'+
        '</div>'+
      '</div></div></section>';

    /* --- 4 COMMAND DECK: caught-up meter + shuffle + spoiler toggle + continue --- */
    html+='<section class="vg-deck brackets" aria-label="Catch-up controls">'+
      '<div class="vg-meter" id="vg-meter">'+
        '<div class="vg-meter__top">'+
          '<span class="telemetry telemetry--nom"><b>MARATHON</b></span>'+
          '<span class="vg-meter__read" id="vg-read" aria-live="polite">CAUGHT UP // 0 OF '+shows.length+' SHOWS</span>'+
        '</div>'+
        '<div class="vg-segs" id="vg-segs" role="img" aria-hidden="true">'+
          shows.map(function(){return '<span class="vg-seg"></span>';}).join("")+
        '</div>'+
        '<p class="vg-meter__note">Tracks this visit only. Cross-week streaks need an account (backend, not yet live).</p>'+
      '</div>'+
      '<div class="vg-deck__actions">'+
        '<button class="vg-btn" type="button" id="vg-shuffle"><svg viewBox="0 0 24 24"><path d="M17 3h4v4M21 3l-6 6M3 17l6-6M7 21H3v-4"/></svg>Surprise me</button>'+
        '<button class="vg-btn vg-toggle" type="button" id="vg-spoiler" aria-pressed="true">Spoilers // Shown</button>'+
      '</div>'+
      '<div class="vg-continue" id="vg-continue"><span class="telemetry telemetry--nom"><b>THIS SESSION</b></span>'+
        '<span id="vg-continue-txt"></span></div>'+
    '</section>';

    /* --- PLE COUNTDOWN band (only when a PLE is within lookahead) --- */
    if(pleInRange(wk)){
      html+='<section class="vg-clock brackets" id="vg-clock" aria-label="Next premium live event">'+
        '<div><span class="vg-clock__lbl">NEXT PREMIUM LIVE EVENT // <b>'+esc(PLE.name.toUpperCase())+'</b> · '+esc(PLE.dates.toUpperCase())+' · '+esc(PLE.venue.toUpperCase())+'</span></div>'+
        '<div class="vg-clock__t" id="vg-clock-t" aria-live="off">--<span class="u">d</span> --<span class="u">h</span> --<span class="u">m</span> --<span class="u">s</span></div>'+
      '</section>';
    }

    /* --- 5 NEW THIS WEEK rail --- */
    html+=rowHTML("new","New this week",
      clips.length+" CLIPS · "+aired.join(" / ").toUpperCase(),
      clips,"See the full week","#vg-fullgrid","");

    /* --- 6 PER-PROMOTION rows (present only) --- */
    ORDER.forEach(function(p){
      var pc=clips.filter(function(c){return c.promo===p;});
      if(!pc.length) return;
      html+=rowHTML(p.toLowerCase(),p+" this week",TABNET[p],pc,"All "+p+" clips","#vg-fullgrid","");
    });

    /* --- 7 ROAD TO PLE rail --- */
    if(pleInRange(wk)){
      var goHome=clips.filter(function(c){return /faceoff|main event|go-home|world title|reigns|rollins/i.test(c.label);}).slice(0,4);
      var pleCard='<li><div class="vg-ple-card brackets">'+
        '<span class="telemetry"><b>LIVE EVENT // '+esc(PLE.dates.toUpperCase())+'</b></span>'+
        '<div><div class="vg-ple-card__nm">'+esc(PLE.name)+'</div>'+
        '<span class="vg-ple-card__cnt" id="vg-ple-days">Counting down</span></div>'+
        '<a class="vg-ple-card__go" href="'+PLE.href+'">Card and streaming</a></div></li>';
      var goItems=goHome.length?'<ul class="tw-rail" role="list">'+pleCard+goHome.map(card).join("")+'</ul>':
                                 '<ul class="tw-rail" role="list">'+pleCard+'</ul>';
      html+='<section class="vg-row vg-row--ple" aria-label="The road to '+esc(PLE.name)+'">'+
        '<div class="vg-row__head"><div><h2 class="vg-row__h">The road to '+esc(PLE.name)+'</h2>'+
        '<span class="telemetry vg-row__sub"><b>'+esc(PLE.dates.toUpperCase())+' · '+esc(PLE.venue.toUpperCase())+'</b></span></div></div>'+
        goItems+
        '<p class="vg-meter__note" style="margin-top:.6rem">Every go-home show feeding into the biggest weekend of the summer, in one place.</p>'+
      '</section>';
    }

    /* --- 8 UP NEXT status (partial) or full-week note --- */
    if(partial){
      html+='<div class="vg-upnext"><span class="telemetry"><b>STILL TO AIR THIS WEEK</b></span>'+
        '<ul class="vg-upnext__list">'+pending.map(function(s){
          return '<li><b>'+s.day+' · '+esc(s.show)+'</b><span>'+esc(s.net)+'</span></li>';
        }).join("")+'</ul>'+
        '<p class="vg-upnext__note">Clips land the morning after each show. Check back, or jump to a finished week above.</p></div>';
    } else {
      html+='<div class="vg-upnext"><span class="telemetry"><b>FULL WEEK IN THE BOOKS</b></span>'+
        '<p class="vg-upnext__note">Six shows captured. Clear the card, then jump to another week above.</p></div>';
    }

    /* --- 9 FULL GRID (demoted master-detail) --- */
    html+='<section class="vg-fullgrid" id="vg-fullgrid" aria-label="The full week, every clip">'+
      '<div class="vg-row__head"><div><h2 class="vg-row__h">The full week</h2>'+
      '<span class="telemetry vg-row__sub"><b>EVERY CLIP · BY PROMOTION</b></span></div></div>'+
      fullGrid(wk)+'</section>';

    /* --- 10 INSIDER (the ONE gold CTA fill) --- */
    html+='<section class="vg-insider brackets" aria-label="Insider email">'+
      '<p class="eyebrow">Catch-up desk // Monday drop</p>'+
      '<h2>The week\'s card, in your inbox</h2>'+
      '<p>One email Monday morning. Every show that aired, every clip worth your time, and what streams where. Titles stay spoiler-safe, same as the gallery.</p>'+
      '<form id="vg-insider-form"><label for="vg-email">Your email</label>'+
        '<input id="vg-email" type="email" placeholder="you@example.com" required autocomplete="email">'+
        '<button class="vg-cta-gold" type="submit">Join the Insider list</button></form>'+
      '<p class="vg-insider__flag">No results in the subject line. Leave anytime. Delivery endpoint is backend work, not wired in this prototype.</p></section>';

    /* --- footer nav --- */
    var newer=WEEKS[i-1], older=WEEKS[i+1];
    html+='<nav class="vg-foot" aria-label="Week navigation">'+
      (newer?'<button class="link-more" data-goweek="'+(i-1)+'">Newer week</button>':'')+
      '<a class="link-more" href="/gallery/">All weeks</a>'+
      (older?'<button class="link-more" data-goweek="'+(i+1)+'">Older week</button>':'')+
    '</nav>';

    root.innerHTML=html;
    wireWeek(wk,shows);
    updateMeter(shows);
  }

  function shortWeek(wk){return new Date(wk.start+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}).toUpperCase();}
  function showFull(s){return ({Raw:"Monday Night Raw",NXT:"WWE NXT",Dynamite:"AEW Dynamite","iMPACT":"TNA iMPACT",SmackDown:"WWE SmackDown",Collision:"AEW Collision"})[s]||s;}
  function netOf(s){return (SHOWNET[s]||["Netflix"])[0];}
  function pleInRange(wk){
    var start=new Date(wk.start+"T00:00:00Z").getTime();
    var ev=new Date(PLE.when).getTime();
    var days=(ev-start)/86400e3;
    return days>=0 && days<=21;
  }

  /* full grid (master-detail tabs) */
  function fullGrid(wk){
    var shows=weekShows(wk);
    var byPromo={};
    ORDER.forEach(function(p){if(wk.promos[p]) byPromo[p]=allClips(wk).filter(function(c){return c.promo===p;});});
    var promos=Object.keys(byPromo);
    var tabs=promos.map(function(p,i){
      return '<button class="tw-item" type="button" role="tab" id="fg-tab-'+p+'" aria-controls="fg-panel-'+p+'" aria-selected="'+(i===0)+'"'+(i?' tabindex="-1"':'')+'>'+
        '<span class="tw-item__name">'+p+'</span><span class="tw-item__net">'+esc(TABNET[p])+'</span></button>';
    }).join("");
    var panels=promos.map(function(p,i){
      return '<div class="tw-panel" role="tabpanel" id="fg-panel-'+p+'" aria-labelledby="fg-tab-'+p+'"'+(i?' hidden':'')+'>'+
        '<div class="tw-panel__head"><span class="telemetry"><b>'+esc(wk.label.toUpperCase())+' · '+p+'</b></span></div>'+
        rail(byPromo[p])+'</div>';
    }).join("");
    return '<div class="tw-layout"><div class="tw-list" role="tablist" aria-label="Choose a promotion">'+tabs+'</div><div class="tw-detail">'+panels+'</div></div>';
  }

  /* ---- week switcher ---- */
  function renderWeekbar(i){
    var bar=document.getElementById("weekbar");
    var newer=i>0, older=i<WEEKS.length-1;
    var chips=WEEKS.map(function(w,j){
      var cur=j===i;
      var short=new Date(w.week+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
      return '<button class="lf-wb__wk'+(cur?" is-cur":"")+'" type="button" data-goweek="'+j+'"'+(cur?' aria-current="page"':'')+'>'+
        short+(j===0?'<span class="lf-wb__live">LIVE</span>':'')+'</button>';
    }).join("");
    bar.innerHTML=
      (newer?'<button class="lf-wb__nav" type="button" data-goweek="'+(i-1)+'">Newer week</button>':'<span class="lf-wb__nav is-off">Newer week</span>')+
      '<div class="lf-wb__track">'+chips+'</div>'+
      (older?'<button class="lf-wb__nav" type="button" data-goweek="'+(i+1)+'">Older week</button>':'<span class="lf-wb__nav is-off">Older week</span>');
  }

  /* ============================================================
     WIRING
     ============================================================ */
  function wireWeek(wk,shows){
    var root=document.getElementById("main");
    // week nav (weekbar + footer)
    document.querySelectorAll("[data-goweek]").forEach(function(b){
      b.addEventListener("click",function(){var j=+b.getAttribute("data-goweek");render(j);window.scrollTo({top:0,behavior:"smooth"});});
    });
    // play facades
    root.querySelectorAll("[data-play]").forEach(function(b){
      b.addEventListener("click",function(){
        openModal(b.getAttribute("data-id"),b.getAttribute("data-title"),b.getAttribute("data-page"));
      });
    });
    // shuffle
    var sh=document.getElementById("vg-shuffle");
    if(sh) sh.addEventListener("click",function(){
      var clips=allClips(wk);
      var pool=clips.filter(function(c){return !watched[c.id];});
      if(!pool.length) pool=clips;
      var pick=pool[Math.floor(Math.random()*pool.length)];
      openModal(pick.id,vtitle(pick),pageUrl(pick.promo,pick.label,pick.date));
    });
    // spoiler toggle
    var sp=document.getElementById("vg-spoiler");
    if(sp) sp.addEventListener("click",function(){
      spoilersShown=!spoilersShown;
      sp.setAttribute("aria-pressed",String(spoilersShown));
      sp.textContent="Spoilers // "+(spoilersShown?"Shown":"Hidden");
      root.classList.toggle("is-spoilers-shown",spoilersShown);
    });
    root.classList.toggle("is-spoilers-shown",spoilersShown);
    // full-grid tabs
    wireTabs(document.querySelector(".tw-list"));
    // insider
    var form=document.getElementById("vg-insider-form");
    if(form) form.addEventListener("submit",function(e){
      e.preventDefault();
      form.innerHTML='<p class="telemetry" style="font-size:11px"><b>REQUEST NOTED // this visit</b></p>';
    });
    // PLE clock
    startClock();
  }

  function wireTabs(list){
    if(!list) return;
    var tabs=[].slice.call(list.querySelectorAll('[role="tab"]'));
    function select(t){
      tabs.forEach(function(x){
        var on=x===t;
        x.setAttribute("aria-selected",String(on));
        x.tabIndex=on?0:-1;
        var panel=document.getElementById(x.getAttribute("aria-controls"));
        if(panel) panel.hidden=!on;
      });
    }
    tabs.forEach(function(t,i){
      t.addEventListener("click",function(){select(t);});
      t.addEventListener("keydown",function(e){
        var n;
        if(e.key==="ArrowRight"||e.key==="ArrowDown") n=tabs[(i+1)%tabs.length];
        else if(e.key==="ArrowLeft"||e.key==="ArrowUp") n=tabs[(i-1+tabs.length)%tabs.length];
        if(n){e.preventDefault();select(n);n.focus();}
      });
    });
  }

  /* ---- meter / gamification (session-only) ---- */
  function updateMeter(shows){
    var done=0;
    var segs=document.querySelectorAll("#vg-segs .vg-seg");
    shows.forEach(function(sh,i){
      var got=sh.clips.some(function(c){return watched[c[0]];});
      if(got) done++;
      if(segs[i]) segs[i].classList.toggle("is-on",got);
    });
    var read=document.getElementById("vg-read");
    var meter=document.getElementById("vg-meter");
    if(read){
      if(done===shows.length && shows.length){
        read.textContent="CAUGHT UP ON THE WEEK OF "+shortWeek(WEEKS[curIndex]);
        meter.classList.add("is-done");
      } else {
        read.textContent="CAUGHT UP // "+done+" OF "+shows.length+" SHOWS";
        meter.classList.remove("is-done");
      }
    }
    // mark seen cards
    Object.keys(watched).forEach(function(id){
      document.querySelectorAll('.vcard[data-id="'+cssEsc(id)+'"]').forEach(function(c){c.classList.add("vg-card--seen");});
    });
    // continue chip
    if(lastPlayed){
      var box=document.getElementById("vg-continue");
      var txt=document.getElementById("vg-continue-txt");
      if(box&&txt){box.classList.add("is-on");
        txt.innerHTML='<a href="'+lastPlayed.page+'">Jump back in: '+esc(lastPlayed.title)+'</a>';}
    }
  }
  function cssEsc(s){return s.replace(/["\\]/g,"\\$&");}

  /* ============================================================
     THEATER MODAL (focus-trapped; mirrors media.js openModal)
     ============================================================ */
  var modal=document.getElementById("wl-modal"), stage=document.getElementById("wl-stage"),
      mTitle=document.getElementById("wl-modal-t"), lastFocus=null;
  function openModal(id,title,page){
    if(!id) return;
    lastFocus=document.activeElement;
    mTitle.textContent=title||"Now playing";
    stage.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+
      '?autoplay=1&rel=0&playsinline=1" title="'+esc(title||"video")+'" allow="accelerated-destination; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    modal.hidden=false; modal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    modal.querySelector(".wl-modal__close").focus();
    // session gamification
    watched[id]=true;
    lastPlayed={id:id,title:title,page:page||"/gallery/"};
    updateMeter(weekShows(WEEKS[curIndex]));
  }
  function closeModal(){
    modal.hidden=true; modal.setAttribute("aria-hidden","true");
    stage.innerHTML=""; document.body.style.overflow="";
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  modal.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",closeModal);});
  document.addEventListener("keydown",function(e){
    if(modal.hidden) return;
    if(e.key==="Escape"){closeModal();return;}
    if(e.key==="Tab"){ // focus trap
      var f=modal.querySelectorAll('button, iframe, [href], input, [tabindex]:not([tabindex="-1"])');
      f=[].slice.call(f).filter(function(x){return x.offsetParent!==null||x.tagName==="IFRAME";});
      if(!f.length) return;
      var first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });

  /* ---- PLE live countdown ---- */
  var clockTimer=null;
  function startClock(){
    if(clockTimer) clearInterval(clockTimer);
    var t=document.getElementById("vg-clock-t");
    var band=document.getElementById("vg-clock");
    var daysEl=document.getElementById("vg-ple-days");
    if(!t&&!daysEl) return;
    function tick(){
      var diff=new Date(PLE.when).getTime()-Date.now();
      if(diff<=0){
        if(band){band.classList.add("is-live");}
        if(t) t.innerHTML='LIVE NOW';
        if(daysEl) daysEl.textContent="Live now";
        return;
      }
      var d=Math.floor(diff/86400e3), h=Math.floor(diff/3600e3)%24,
          m=Math.floor(diff/60e3)%60, s=Math.floor(diff/1e3)%60;
      var p=function(n){return (n<10?"0":"")+n;};
      if(t) t.innerHTML='T-MINUS '+p(d)+'<span class="u">d</span> '+p(h)+'<span class="u">h</span> '+p(m)+'<span class="u">m</span> '+p(s)+'<span class="u">s</span>';
      if(daysEl) daysEl.textContent=d+" days out";
    }
    tick(); clockTimer=setInterval(tick,1000);
  }

  /* boot */
  render(0);
})();
</script>
</body>
</html>
