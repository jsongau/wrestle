<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wrestle Lore">
  <defs>
    <linearGradient id="wl-plate" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dc82"/>
      <stop offset=".40" stop-color="#d4af37"/>
      <stop offset=".74" stop-color="#b8952b"/>
      <stop offset="1" stop-color="#8c7420"/>
    </linearGradient>
    <linearGradient id="wl-bevel" x1="32" y1="7" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdeecd" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#8c7420" stop-opacity="0"/>
      <stop offset="1" stop-color="#4f3f10" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="wl-spec" x1="32" y1="5" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- outer definition ring: keeps the gold plate readable on light tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#6b571a"/>
  <!-- championship plate -->
  <rect x="3.25" y="3.25" width="57.5" height="57.5" rx="12.75" fill="url(#wl-plate)"/>
  <!-- top specular highlight -->
  <rect x="6" y="6" width="52" height="27" rx="10" fill="url(#wl-spec)"/>
  <!-- raised inner rim -->
  <rect x="7.5" y="7.5" width="49" height="49" rx="9.5" fill="none" stroke="url(#wl-bevel)" stroke-width="2"/>

  <!-- hero W glyph -->
  <path d="M14.5 19 L22.5 43 L32 25.5 L41.5 43 L49.5 19"
        fill="none" stroke="#0b0c10" stroke-width="7.8"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- red accent baseline -->
  <rect x="23" y="49" width="18" height="3.6" rx="1.8" fill="#e11d2a"/>
</svg>
