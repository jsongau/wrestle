<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
{{HEAD_EXTRA}}<link rel="stylesheet" href="/css/site.css">
<style>
/* ============================================================
   TOKENS (mirror of css/site.css :root, for prototype only)
   ============================================================ */
:root{
  --c-bg:#0a0b0d; --c-bg-elev-1:#121418; --c-bg-elev-2:#1a1d23; --c-bg-elev-3:#23272f;
  --c-line:#2b3038; --c-line-strong:#3a414c;
  --c-text:#e8eaed; --c-text-muted:#a2a9b4; --c-text-dim:#6b727d;
  --c-gold:#d4af37; --c-gold-bright:#f2cc4b; --c-gold-dim:#8c7420; --c-gold-tint:rgba(212,175,55,.12);
  --c-red:#e11d2a; --c-red-bright:#ff3b48; --c-red-dim:#8f1219; --c-red-tint:rgba(225,29,42,.12);
  --c-focus:#5aa9ff; --c-wwe:#c8102e; --c-nxt:#f5c518; --c-aew:#c8a24a; --c-tna:#1e73be;
  --fs-300:clamp(.78rem,.74rem + .20vw,.875rem);
  --fs-400:clamp(.94rem,.90rem + .25vw,1.05rem);
  --fs-500:clamp(1.13rem,1.05rem + .40vw,1.35rem);
  --fs-700:clamp(1.65rem,1.35rem + 1.50vw,2.55rem);
  --fs-800:clamp(2.05rem,1.55rem + 2.60vw,3.60rem);
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem; --sp-6:2rem; --sp-7:3rem;
  --r-sm:4px; --r-md:8px; --r-lg:14px; --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --font-cond:"Oswald","Arial Narrow",system-ui,sans-serif;
  --font-disp:"Anton","Oswald","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body);
  font-size:var(--fs-400);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:var(--c-gold-bright);text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px;border-radius:var(--r-sm);}
.wrap{width:min(1180px,92vw);margin-inline:auto;}
.section{padding-block:var(--sp-6);}
.eyebrow{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.12em;
  color:var(--c-gold);font-size:var(--fs-300);font-weight:700;margin:0;}
.rule-gold{height:2px;border:0;width:min(120px,32%);margin:var(--sp-3) 0 0;
  background:linear-gradient(90deg,var(--c-gold),transparent);}
.telemetry{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.18em;
  font-size:9px;color:var(--c-text-dim);display:inline-flex;align-items:center;gap:.5em;}
.telemetry::before{content:"";width:.5em;height:.5em;background:var(--c-red);border-radius:1px;flex:0 0 auto;}
.telemetry b{color:var(--c-gold);font-weight:600;}
.telemetry--nom::before{display:none;}
.link-more{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;
  font-size:var(--fs-300);font-weight:600;color:var(--c-text-muted);text-decoration:none;white-space:nowrap;}
.link-more:hover{color:var(--c-gold);}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:.5em;padding:0;margin:0 0 var(--sp-3);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-text-dim);}
.crumbs li+li::before{content:"/";margin-right:.5em;color:var(--c-line-strong);}
.crumbs a{color:var(--c-text-muted);text-decoration:none;}
.crumbs a:hover{color:var(--c-gold);}

/* ---- corner brackets utility ---- */
.brackets{position:relative;}
.brackets::before,.brackets::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;}
.brackets::before{top:6px;left:6px;border-top:1px solid var(--c-gold-dim);border-left:1px solid var(--c-gold-dim);}
.brackets::after{bottom:6px;right:6px;border-bottom:1px solid var(--c-gold-dim);border-right:1px solid var(--c-gold-dim);}

/* ============================================================
   WEEK SWITCHER (reuse .lf-weekbar), sticky wrapper (.vg-weekbar-stick)
   ============================================================ */
.vg-weekbar-stick{position:sticky;top:calc(var(--wl-shell-h,103px) + 40px);z-index:40;
  background:color-mix(in srgb,var(--c-bg) 88%,transparent);backdrop-filter:blur(10px);}
.lf-weekbar{display:flex;align-items:center;gap:8px;margin:0;padding:10px 0;
  border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line);}
.lf-wb__nav{flex:0 0 auto;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-gold);border:1px solid var(--c-line-strong);border-radius:2px;
  padding:6px 10px;white-space:nowrap;background:none;cursor:pointer;}
.lf-wb__nav:hover{color:var(--c-gold-bright);border-color:var(--c-gold-dim);}
.lf-wb__nav.is-off{color:var(--c-text-dim);border-color:var(--c-line);opacity:.5;pointer-events:none;}
.lf-wb__track{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.lf-wb__track::-webkit-scrollbar{display:none;}
.lf-wb__wk{flex:0 0 auto;font-family:var(--font-cond);font-weight:600;font-size:.8rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--c-text-muted);border:1px solid var(--c-line);border-radius:2px;
  padding:5px 12px;white-space:nowrap;background:none;cursor:pointer;transition:border-color .15s,color .15s;}
.lf-wb__wk:hover{color:#fff;border-color:var(--c-line-strong);}
.lf-wb__wk.is-cur{color:#000;background:var(--c-gold);border-color:var(--c-gold);font-weight:700;}
.lf-wb__live{display:inline-block;margin-left:.5em;font-family:var(--font-mono);font-size:8px;
  letter-spacing:.14em;color:var(--c-red-bright);vertical-align:middle;}
@media (max-width:600px){.vg-weekbar-stick{position:static;}}

/* ============================================================
   SPOTLIGHT HERO (.vg-spot, adapts .media-hero / .mh-*)
   ============================================================ */
.vg-spot{padding-block:var(--sp-6) var(--sp-5);}
.mh-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-6);align-items:center;}
@media (min-width:920px){.mh-grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:var(--sp-7);}}
.mh-copy{min-width:0;}
.vg-spot__h{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;
  font-size:var(--fs-800);line-height:.94;letter-spacing:.01em;margin:.15em 0 0;}
.ev-lede{color:var(--c-text-muted);max-width:56ch;margin:var(--sp-4) 0 0;}
.vg-spot__reassure{margin:var(--sp-3) 0 0;font-size:var(--fs-300);color:var(--c-text-dim);max-width:56ch;}
.vg-spot__meta{margin-top:var(--sp-4);}
.mh-feature{position:relative;min-width:0;border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);
  padding:calc(var(--sp-3) + 4px);background:var(--c-bg-elev-1);}
.mh-feature .yt{border-radius:calc(var(--r-lg) - 4px);overflow:hidden;border:1px solid var(--c-line);}
.mh-tag{position:absolute;z-index:6;top:calc(var(--sp-3) + 10px);left:calc(var(--sp-3) + 10px);
  display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text);background:rgba(10,11,13,.72);
  border:1px solid var(--c-line-strong);border-radius:var(--r-pill);padding:.4em .8em;backdrop-filter:blur(4px);}
.mh-tag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--c-red);
  box-shadow:0 0 0 3px var(--c-red-tint);}
.mh-cap{padding:var(--sp-3) var(--sp-2) var(--sp-2);}
.mh-k{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--c-text-dim);}
.mh-ft{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;line-height:.95;
  font-size:var(--fs-700);margin:.1em 0 .15em;}
.mh-sub{display:block;font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.04em;
  font-size:var(--fs-400);color:var(--c-text-muted);}
.mh-sub b{color:var(--c-gold);font-weight:600;}
.mh-hint{margin-top:var(--sp-2);display:inline-flex;align-items:center;gap:.5em;
  font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-size:var(--fs-300);color:var(--c-text-muted);}
.mh-hint svg{width:15px;height:15px;fill:var(--c-red-bright);}

/* ============================================================
   COMMAND DECK (.vg-deck): caught-up meter + shuffle + spoiler toggle + continue
   ============================================================ */
.vg-deck{display:grid;gap:var(--sp-4);grid-template-columns:1fr;padding:var(--sp-4) var(--sp-5) var(--sp-5);
  border:1px solid var(--c-line);border-radius:var(--r-lg);background:var(--c-bg-elev-1);margin-top:var(--sp-4);}
@media (min-width:820px){.vg-deck{grid-template-columns:1.6fr 1fr;align-items:center;}}
.vg-meter__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;}
.vg-meter__read{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold);}
.vg-segs{display:flex;gap:6px;margin-top:var(--sp-3);}
.vg-seg{flex:1;height:10px;border:1px solid var(--c-gold-dim);border-radius:2px;background:transparent;
  position:relative;overflow:hidden;}
.vg-seg::after{content:"";position:absolute;inset:0;background:var(--c-gold);transform:scaleX(0);
  transform-origin:left;transition:transform .35s var(--ease);}
.vg-seg.is-on::after{transform:scaleX(1);}
.vg-meter__note{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-text-dim);margin-top:var(--sp-2);}
.vg-meter.is-done .vg-meter__read{color:var(--c-gold-bright);}
.vg-deck__actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;justify-content:flex-start;}
@media (min-width:820px){.vg-deck__actions{justify-content:flex-end;}}
.vg-btn{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  font-size:var(--fs-300);color:var(--c-gold);background:none;border:1px solid var(--c-gold-dim);
  border-radius:2px;padding:.6em 1em;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;
  transition:border-color .15s,color .15s,background .15s;}
.vg-btn:hover{color:var(--c-gold-bright);border-color:var(--c-gold);background:var(--c-gold-tint);}
.vg-btn svg{width:15px;height:15px;fill:currentColor;}
.vg-toggle[aria-pressed="true"]{color:var(--c-red-bright);border-color:var(--c-red-dim);}
.vg-continue{grid-column:1/-1;display:none;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding-top:var(--sp-3);border-top:1px solid var(--c-line);}
.vg-continue.is-on{display:flex;}
.vg-continue a{color:var(--c-gold-bright);text-decoration:none;font-family:var(--font-cond);
  text-transform:uppercase;letter-spacing:.03em;font-weight:600;}

/* ---- PLE countdown band (.vg-clock) ---- */
.vg-clock{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;
  margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-5);border:1px solid var(--c-gold-dim);
  border-radius:var(--r-lg);background:var(--c-bg-elev-1);}
.vg-clock__lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-muted);}
.vg-clock__lbl b{color:var(--c-gold);}
.vg-clock__t{font-family:var(--font-disp);font-size:var(--fs-700);letter-spacing:.06em;color:var(--c-text);}
.vg-clock__t .u{color:var(--c-text-dim);font-size:.5em;font-family:var(--font-mono);letter-spacing:.1em;}
.vg-clock.is-live .vg-clock__t{color:var(--c-red-bright);}

/* ============================================================
   HORIZONTAL ROWS (.vg-row, reuse .tw-rail scroller)
   ============================================================ */
.vg-row{padding-block:var(--sp-5);}
.vg-row__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-4);}
.vg-row__h{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;
  font-size:var(--fs-700);line-height:1;margin:0 0 .25em;}
.vg-row__sub{display:block;}
.tw-rail{display:flex;gap:var(--sp-4);overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;padding:0 0 .6rem;list-style:none;margin:0;scrollbar-width:thin;
  scrollbar-color:var(--c-gold-dim) transparent;
  background:linear-gradient(270deg,rgba(242,204,75,.16),transparent 30px) right center/30px 82% no-repeat;}
.tw-rail>li{flex:0 0 clamp(220px,64%,270px);scroll-snap-align:start;}
.tw-rail::-webkit-scrollbar{height:6px;}
.tw-rail::-webkit-scrollbar-thumb{background:var(--c-gold-dim);border-radius:99px;}
.tw-rail::-webkit-scrollbar-track{background:transparent;}
.vg-row--ple .vg-row__h{color:var(--c-text);}

/* ---- vcard (reused) ---- */
.vcard{background:var(--c-bg-elev-1);border:1px solid var(--c-line);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;height:100%;position:relative;
  transition:border-color .18s,transform .18s;}
.vcard:hover{border-color:var(--c-line-strong);transform:translateY(-3px);}
.vcard__body{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);flex:1;}
.vcard__title{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.01em;font-weight:600;
  font-size:var(--fs-500);line-height:1.1;margin:0;color:var(--c-text);}
.vcard__meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;margin-top:auto;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-dim);}
.vcard__flag{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-red-bright);border:1px solid var(--c-red-dim);border-radius:2px;padding:.15em .5em;}
/* seen state */
.vg-card--seen{border-color:var(--c-gold-dim);}
.vg-card--seen .yt__thumb{filter:brightness(.45) saturate(.6);}
.vg-card--seen .vcard__body::before{content:"";}
.vg-seen-tick{position:absolute;top:var(--sp-3);right:var(--sp-3);z-index:7;width:22px;height:22px;
  display:none;place-content:center;border-radius:50%;background:var(--c-gold);color:#000;}
.vg-card--seen .vg-seen-tick{display:grid;}
.vg-seen-tick svg{width:13px;height:13px;fill:#000;}

/* ---- .yt facade (reused, spoiler-blurred under .thisweek) ---- */
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000;border:0;padding:0;cursor:pointer;}
.yt__thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.yt__play{position:absolute;inset:0;margin:auto;width:64px;height:44px;display:grid;place-content:center;
  background:rgba(10,11,13,.66);border:1px solid var(--c-line-strong);border-radius:12px;
  transition:transform .18s,background .18s;pointer-events:none;}
.yt__play svg{width:24px;height:24px;fill:#fff;}
.yt:hover .yt__play,.yt:focus-visible .yt__play{transform:scale(1.08);background:var(--c-red-bright);border-color:var(--c-red-bright);}
.yt__cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:var(--sp-4) var(--sp-3) var(--sp-2);
  background:linear-gradient(0deg,rgba(10,11,13,.85),transparent);
  font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-300);
  color:#fff;text-align:left;pointer-events:none;}
/* spoiler blur */
.thisweek .yt__thumb{filter:blur(16px) brightness(.55);transform:scale(1.06);
  transition:filter .35s var(--ease),transform .35s var(--ease);}
.thisweek .yt:hover .yt__thumb,.thisweek .yt:focus-visible .yt__thumb{filter:none;transform:none;}
.thisweek.is-spoilers-shown .yt__thumb{filter:none;transform:none;}
@media (prefers-reduced-motion:reduce){.thisweek .yt__thumb,.vg-seg::after{transition:none;}}

/* ---- UP NEXT strip (.vg-upnext) ---- */
.vg-upnext{margin-top:var(--sp-5);padding:var(--sp-5);border:1px dashed var(--c-line-strong);border-radius:var(--r-lg);}
.vg-upnext__list{list-style:none;display:flex;flex-wrap:wrap;gap:var(--sp-3);padding:0;margin:var(--sp-3) 0;}
.vg-upnext__list li{display:flex;flex-direction:column;gap:.1em;padding:.6em .9em;border:1px solid var(--c-line);
  border-radius:var(--r-md);background:var(--c-bg-elev-1);min-width:118px;}
.vg-upnext__list b{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;color:var(--c-text);font-size:var(--fs-400);}
.vg-upnext__list span{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-text-dim);}
.vg-upnext__note{margin:var(--sp-2) 0 0;color:var(--c-text-muted);font-size:var(--fs-300);}

/* ---- PLE event card (.vg-ple-card) ---- */
.vg-ple-card{display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp-3);height:100%;
  padding:var(--sp-4);border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);background:var(--c-bg-elev-2);}
.vg-ple-card__nm{font-family:var(--font-disp);font-weight:400;text-transform:uppercase;font-size:var(--fs-700);line-height:.95;margin:.1em 0;}
.vg-ple-card__cnt{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold-bright);}
.vg-ple-card__go{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:600;
  font-size:var(--fs-300);color:var(--c-gold);border:1px solid var(--c-gold-dim);border-radius:2px;
  padding:.5em .9em;text-decoration:none;align-self:flex-start;}
.vg-ple-card__go:hover{color:var(--c-gold-bright);border-color:var(--c-gold);}

/* ============================================================
   FULL GRID (demoted .tw-layout master-detail)
   ============================================================ */
.vg-fullgrid{margin-top:var(--sp-6);padding-top:var(--sp-6);border-top:1px solid var(--c-line);}
.tw-layout{display:grid;grid-template-columns:minmax(210px,260px) 1fr;gap:var(--sp-5);align-items:start;margin-top:var(--sp-4);}
.tw-list{display:flex;flex-direction:column;gap:.6rem;}
.tw-item{text-align:left;display:flex;flex-direction:column;gap:.15rem;padding:.9rem 1.05rem;
  background:var(--c-bg-elev-1);border:1px solid var(--c-line);border-radius:var(--r-md);cursor:pointer;
  transition:border-color .18s,background .18s;}
.tw-item:hover{border-color:var(--c-line-strong);}
.tw-item[aria-selected="true"]{border-color:var(--c-gold-bright);background:var(--c-bg-elev-2);}
.tw-item__name{font-family:var(--font-disp);font-size:var(--fs-500);letter-spacing:.02em;color:var(--c-text);text-transform:uppercase;line-height:1.1;}
.tw-item__net{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--c-text-dim);text-transform:uppercase;}
.tw-panel[hidden]{display:none;}
.tw-panel__head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:var(--sp-3);flex-wrap:wrap;}
.tw-net{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--c-gold-bright);text-decoration:none;
  border:1px solid var(--c-line-strong);padding:.42em .85em;border-radius:var(--r-pill);white-space:nowrap;}
.tw-net:hover{border-color:var(--c-gold-bright);background:var(--c-gold-tint);}
@media (max-width:760px){.tw-layout{grid-template-columns:1fr;}.tw-list{flex-direction:row;overflow-x:auto;}}

/* ---- Insider (single gold CTA fill on the page) ---- */
.vg-insider{margin-top:var(--sp-6);padding:var(--sp-6);border:1px solid var(--c-gold-dim);border-radius:var(--r-lg);
  background:var(--c-bg-elev-1);}
.vg-insider h2{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.02em;font-size:var(--fs-500);margin:.2em 0;}
.vg-insider p{color:var(--c-text-muted);max-width:60ch;margin:0 0 var(--sp-4);}
.vg-insider form{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;}
.vg-insider label{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-text-dim);display:block;width:100%;margin-bottom:.4em;}
.vg-insider input{flex:1 1 240px;background:var(--c-bg-elev-2);border:1px solid var(--c-line-strong);
  border-radius:var(--r-md);color:var(--c-text);padding:.7em 1em;font-family:var(--font-body);font-size:var(--fs-400);}
.vg-cta-gold{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:700;
  background:var(--c-gold);color:#000;border:1px solid var(--c-gold);border-radius:var(--r-md);
  padding:.7em 1.3em;cursor:pointer;font-size:var(--fs-400);}
.vg-cta-gold:hover{background:var(--c-gold-bright);}
.vg-insider__flag{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--c-text-dim);margin-top:var(--sp-3);}

/* ---- footer nav ---- */
.vg-foot{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin-top:var(--sp-6);padding-top:var(--sp-5);border-top:1px solid var(--c-line);}

/* ============================================================
   THEATER MODAL (mirrors js/media.js openModal; focus-trapped)
   ============================================================ */
.wl-modal[hidden]{display:none;}
.wl-modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:var(--sp-4);}
.wl-modal__backdrop{position:absolute;inset:0;background:rgba(5,6,8,.82);backdrop-filter:blur(6px);}
.wl-modal__box{position:relative;width:min(980px,96vw);background:var(--c-bg-elev-1);border:1px solid var(--c-line-strong);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.6);}
.wl-modal__bar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--c-line);}
.wl-modal__t{font-family:var(--font-cond);text-transform:uppercase;letter-spacing:.03em;font-weight:600;font-size:var(--fs-400);color:var(--c-text);}
.wl-modal__close{background:none;border:1px solid var(--c-line-strong);color:var(--c-text);border-radius:var(--r-md);
  width:38px;height:38px;cursor:pointer;font-size:1.1rem;}
.wl-modal__close:hover{border-color:var(--c-gold);color:var(--c-gold);}
.wl-modal__stage{aspect-ratio:16/9;background:#000;}
.wl-modal__stage iframe{width:100%;height:100%;border:0;display:block;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* MEDIA SUB-NAV (preview) */
.wl-subnav{position:sticky;top:calc(var(--wl-shell-h,103px) - 2px);z-index:95;background:color-mix(in srgb,var(--c-bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--c-line);}
.wl-subnav__inner{display:flex;align-items:stretch;gap:var(--sp-4);height:42px;}
.wl-subnav__tag{flex:0 0 auto;display:none;align-items:center;white-space:nowrap;font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--c-text-dim);}
.wl-subnav__tag::before{content:"";width:.5em;height:.5em;margin-right:.6em;background:var(--c-red);border-radius:1px;align-self:center;}
@media(min-width:760px){.wl-subnav__tag{display:inline-flex;}}
.wl-subnav__list{flex:1 1 auto;min-width:0;margin:0;padding:0;list-style:none;display:flex;flex-wrap:nowrap;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;}
.wl-subnav__list::-webkit-scrollbar{display:none;}
.wl-subnav__list a{display:inline-flex;align-items:center;height:100%;padding:0 .9em;white-space:nowrap;font-family:var(--font-cond);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:var(--fs-300);color:var(--c-text-muted);text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.wl-subnav__list a:hover{color:var(--c-text);}
.wl-subnav__list a[aria-current="page"]{color:var(--c-gold-bright);border-bottom-color:var(--c-gold);}

/* ============================================================
   THE TUNER (filter deck): chip bar + search + count + reset
   ============================================================ */
.vg-tuner{margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-5);border:1px solid var(--c-line);
  border-radius:var(--r-lg);background:var(--c-bg-elev-1);display:flex;flex-direction:column;gap:var(--sp-3);}
.vg-tuner__top{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}
.vg-tuner__count{margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-gold);}
.vg-tuner__reset{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-red-bright);background:none;border:1px solid var(--c-red-dim);border-radius:2px;
  padding:5px 10px;cursor:pointer;}
.vg-tuner__reset:hover{background:var(--c-red-tint);}
.vg-tuner__search{display:flex;align-items:center;gap:.6em;border:1px solid var(--c-line-strong);
  border-radius:var(--r-md);background:var(--c-bg-elev-2);padding:.5em .9em;}
.vg-tuner__search svg{width:15px;height:15px;color:var(--c-text-dim);flex:0 0 auto;}
.vg-tuner__search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--c-text);
  font-family:var(--font-body);font-size:var(--fs-300);}
.vg-tuner__search input::placeholder{color:var(--c-text-dim);}
.vg-tuner__search:focus-within{border-color:var(--c-gold-dim);}
.vg-tuner__qx{background:none;border:0;color:var(--c-text-dim);font-size:1rem;cursor:pointer;padding:0 .2em;}
.vg-tuner__qx:hover{color:var(--c-gold);}
.vg-facet{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.vg-facet__lbl{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--c-text-dim);flex:0 0 84px;}
.vg-chip{font-family:var(--font-cond);font-weight:600;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--c-text-muted);background:none;border:1px solid var(--c-line);
  border-left:3px solid var(--acc,var(--c-line-strong));border-radius:2px;padding:5px 10px;cursor:pointer;
  display:inline-flex;align-items:center;gap:.55em;transition:border-color .15s,color .15s,background .15s;}
.vg-chip:hover{color:#fff;border-color:var(--c-line-strong);}
.vg-chip[aria-pressed="true"]{color:var(--c-gold-bright);border-color:var(--c-gold-dim);background:var(--c-gold-tint);}
.vg-chip__n{font-style:normal;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--c-text-dim);}
.vg-chip[aria-pressed="true"] .vg-chip__n{color:var(--c-gold);}
.vg-chip.is-void{opacity:.38;}
.vg-tuner__zero{border-top:1px dashed var(--c-line-strong);padding-top:var(--sp-3);}
.vg-tuner__zerotxt{color:var(--c-text-muted);font-size:var(--fs-300);margin:.4em 0 0;}
.vg-tuner__zeroacts{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-2);}
.vg-tuner__zeroacts .vg-btn{font-size:.78rem;padding:.5em .9em;}
.vg-btn:disabled{opacity:.4;cursor:default;pointer-events:none;}
/* filtered-out cards and rows */
.tw-rail>li[hidden]{display:none;}
.vg-row.is-filtered-out,.vg-upnext.is-filtered-out{display:none;}
.tw-item.is-void{opacity:.38;}
@media (max-width:600px){.vg-facet__lbl{flex-basis:100%;}}

/* ============================================================
   STICKY DAY RAIL (.vg-dayrail): bottom dock tune-in calendar
   Stacking: weekbar 40 / subnav 95 / RAIL 120 / modal 200 (wins).
   ============================================================ */
body.has-dayrail{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));}
body.has-dayrail.rail-collapsed{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));}
.vg-dayrail{position:fixed;left:0;right:0;bottom:0;z-index:120;
  transition:transform .25s var(--ease);}
.vg-dayrail.is-collapsed{transform:translateY(100%);}
.vg-dr__tab{position:absolute;right:max(4vw,16px);bottom:100%;margin-bottom:-1px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--c-text-muted);background:var(--c-bg-elev-1);border:1px solid var(--c-line);
  border-bottom:0;border-radius:6px 6px 0 0;padding:5px 12px;cursor:pointer;}
.vg-dr__tab:hover{color:var(--c-gold);border-color:var(--c-gold-dim);}
.vg-dr__shell{border-top:1px solid var(--c-gold-dim);
  background:color-mix(in srgb,var(--c-bg) 92%,transparent);backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom,0px);}
.vg-dr__inner{display:flex;align-items:stretch;gap:8px;padding:8px 0;}
.vg-dr__nav{flex:0 0 auto;align-self:center;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold);
  border:1px solid var(--c-line-strong);border-radius:2px;padding:6px 10px;
  white-space:nowrap;background:none;cursor:pointer;}
.vg-dr__nav:hover{color:var(--c-gold-bright);border-color:var(--c-gold-dim);}
.vg-dr__nav.is-off{color:var(--c-text-dim);border-color:var(--c-line);opacity:.5;pointer-events:none;}
.vg-dr__days{flex:1;display:flex;gap:6px;overflow-x:auto;list-style:none;margin:0;
  padding:0 0 2px;scrollbar-width:none;min-width:0;}
.vg-dr__days::-webkit-scrollbar{display:none;}
.vg-dr__days>li{flex:1 1 0;min-width:96px;display:flex;}
.vg-dr__day{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start;
  text-align:left;background:var(--c-bg-elev-1);border:1px solid var(--c-line);
  border-top:2px solid var(--acc,var(--c-line-strong));border-radius:6px;
  padding:6px 9px 7px;color:var(--c-text-muted);position:relative;font:inherit;cursor:default;
  transition:border-color .15s,background .15s;}
.vg-dr__head{display:flex;align-items:baseline;gap:.45em;width:100%;}
.vg-dr__dw{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--c-text-dim);}
.vg-dr__dn{font-family:var(--font-cond);font-weight:700;font-size:.95rem;line-height:1;color:var(--c-text);}
.vg-dr__ple{margin-left:auto;font-family:var(--font-mono);font-size:8px;letter-spacing:.12em;
  color:var(--c-gold-bright);border:1px solid var(--c-gold-dim);border-radius:3px;padding:1px 4px;}
.vg-dr__show{font-family:var(--font-cond);font-weight:600;font-size:.78rem;letter-spacing:.03em;
  text-transform:uppercase;color:var(--c-text);line-height:1.1;white-space:nowrap;}
.vg-dr__st{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--c-text-dim);white-space:nowrap;}
/* state: aired with clips (gold hairline, clickable) */
button.vg-dr__day--on{cursor:pointer;border-color:var(--c-gold-dim);}
.vg-dr__day--on .vg-dr__st{color:var(--c-gold);}
button.vg-dr__day--on:hover{border-color:var(--c-gold);background:var(--c-bg-elev-2);}
.vg-dr__day--on[aria-pressed="true"]{border-color:var(--c-gold-bright);background:var(--c-gold-tint);}
.vg-dr__day--on[aria-pressed="true"] .vg-dr__dn{color:var(--c-gold-bright);}
/* state: aired, clips pending */
.vg-dr__day--wait{opacity:.55;}
/* state: upcoming */
.vg-dr__day--soon .vg-dr__st{color:var(--c-text-muted);}
/* state: dark night */
.vg-dr__day--off{opacity:.4;}
@media (max-width:700px){
  .vg-dr__inner{padding:6px 0;gap:6px;}
  .vg-dr__nav{padding:4px 8px;}
  .vg-dr__days>li{flex:0 0 auto;min-width:118px;}  /* one horizontal scroll row */
}
@media (prefers-reduced-motion:reduce){.vg-dayrail{transition:none;}}

/* day-filter banner, injected under the tuner when a night is picked */
.vg-dayband{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);border:1px solid var(--c-gold-dim);
  border-left:2px solid var(--c-gold);border-radius:var(--r-md);background:var(--c-bg-elev-1);}
.vg-dayband__n{color:var(--c-text-muted);font-size:var(--fs-300);}
.vg-dayband .vg-btn{margin-left:auto;}
.vg-row{scroll-margin-top:100px;}
</style>
</head>
<body>
<header class="site-header nav7"></header>

{{SUBNAV}}
<main id="main" class="section thisweek" aria-label="Viewing Gallery">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><ol>
      <li><a href="/">Home</a></li>
      <li><a href="/gallery/">Viewing Gallery</a></li>
      <li aria-current="page" id="crumb-week">{{CRUMB}}</li>
    </ol></nav>
  </div>

  <!-- 1 · STICKY WEEK SWITCHER -->
  <div class="vg-weekbar-stick">
    <div class="wrap">
      <nav class="lf-weekbar" aria-label="Switch week" id="weekbar"></nav>
    </div>
  </div>

  <div class="wrap" id="week-root">
{{BACKBONE}}
  </div>
</main>

<!-- THEATER MODAL -->
<div class="wl-modal" id="wl-modal" hidden aria-hidden="true">
  <div class="wl-modal__backdrop" data-close></div>
  <div class="wl-modal__box" role="dialog" aria-modal="true" aria-labelledby="wl-modal-t">
    <div class="wl-modal__bar">
      <span class="wl-modal__t" id="wl-modal-t">Now playing</span>
      <button class="wl-modal__close" type="button" data-close aria-label="Close player">&#215;</button>
    </div>
    <div class="wl-modal__stage" id="wl-stage"></div>
  </div>
</div>

<!-- STICKY DAY RAIL (tune-in calendar, rendered by JS) -->
<nav class="vg-dayrail" id="vg-dayrail" aria-label="This week's TV nights">
  <button class="vg-dr__tab" id="vg-dr-tab" type="button" aria-expanded="true"
          aria-controls="vg-dr-dock">Hide week rail</button>
  <div class="vg-dr__shell">
    <div class="wrap vg-dr__inner" id="vg-dr-dock"><!-- renderDayRail(i) fills this --></div>
  </div>
</nav>

<script>
(function(){
  "use strict";
  /* ============================================================
     DATA MODEL (mirror of build_gallery.py WEEKS + SCHEDULE + PLE)
     Real, oEmbed-verified IDs already in WEEKS.
     ============================================================ */
  var SHOWNET = {
    Raw:["Netflix","Mon"], SmackDown:["Peacock","Fri"], NXT:["The CW","Tue"],
    Dynamite:["HBO Max","Wed"], Collision:["HBO Max","Sat"], "iMPACT":["AMC+","Thu"],
    SummerSlam:["ESPN","Sat"], RAF:["Fox Nation","Sat"]
  };
  var TABNET = {WWE:"RAW // NETFLIX · SMACKDOWN // PEACOCK", AEW:"TBS / TNT · STREAM ON HBO MAX",
                TNA:"IMPACT · AMC & AMC+", NXT:"NXT · THE CW", RAF:"RAF · FOX NATION"};
  var ORDER = ["WWE","AEW","TNA","NXT","RAF"];
  var SCHEDULE = [ /* recurring grid, Mon..Sat */
    {day:"Mon",show:"Raw",promo:"WWE",net:"Netflix"},
    {day:"Tue",show:"NXT",promo:"NXT",net:"The CW"},
    {day:"Wed",show:"Dynamite",promo:"AEW",net:"HBO Max"},
    {day:"Thu",show:"iMPACT",promo:"TNA",net:"AMC+"},
    {day:"Fri",show:"SmackDown",promo:"WWE",net:"Peacock"},
    {day:"Sat",show:"Collision",promo:"AEW",net:"HBO Max"}
  ];
  var PLE = {name:"All In: London", when:"2026-08-30T18:00:00Z", venue:"Wembley Stadium · London",
             dates:"Aug 30", stream:"HBO Max", href:"/events/"};
  var SPECIALS={ /* date -> special; PLE badge on the day rail */
    "2026-07-18":{nm:"SNME",net:"Peacock"},
    "2026-07-26":{nm:"Redemption",net:"HBO Max"},
    "2026-08-01":{nm:"SummerSlam",net:"ESPN"},
    "2026-08-02":{nm:"SummerSlam",net:"ESPN"},
    "2026-08-30":{nm:"All In",net:"HBO Max"},
    "2026-09-06":{nm:"SNME",net:"Peacock"},
    "2026-07-11":{nm:"RAF Georgia",net:"Fox Nation"},
    "2026-07-18":{nm:"RAF 11",net:"Fox Nation"},
    "2026-08-22":{nm:"RAF 12",net:"Fox Nation"}
  };
  var DAYACC={Mon:"--c-wwe",Tue:"--c-nxt",Wed:"--c-aew",Thu:"--c-tna",Fri:"--c-wwe",Sat:"--c-aew"};
  var SHOWACC={Raw:"--c-wwe",SmackDown:"--c-wwe",NXT:"--c-nxt",Dynamite:"--c-aew",Collision:"--c-aew","iMPACT":"--c-tna",RAF:"--c-raf"};
  var DAYKEYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var WEEKS = {{WEEKS_JSON}};

  /* ---- session-only state (NO storage) ---- */
  var watched = {};        // ytid -> true, current visit only
  var spoilersShown = true;
  var lastPlayed = null;   // {id,title,page}
  var curIndex = {{INIT_WEEK}};
  /* ---- filter state: AND across facets, OR within a facet. Empty set = facet off (ALL).
         days is keyed by weekday name ("Mon".."Sun"); the bottom day rail owns that facet. ---- */
  var filt = { promos:{}, shows:{}, kinds:{}, days:{}, q:"" };
  var lastFacetTouched = null;   // last facet the user touched (escape-hatch hint)
  var filterListeners = [];      // day rail subscribes here
  var railCollapsed = false;     // session-only

  /* ---- helpers ---- */
  function el(html){var t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
  function showOf(label){return label.split("·")[0].trim();}
  function descOf(label){var i=label.indexOf("·");return i<0?"Highlights":label.slice(i+1).trim();}
  function thumb(id){return "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";}
  function pageUrl(promo,label,date){
    var s=(promo+" "+label+" "+date).toLowerCase().replace(/·/g," ").replace(/&/g,"and")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    return "/media/w/"+s+"/";
  }
  function dayShort(date){
    var d=new Date(date+"T12:00:00Z");
    return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}).toUpperCase();
  }
  function isNew(date){ // <=48h from "now" (prototype clock)
    return (Date.now()-new Date(date+"T12:00:00Z").getTime())<=48*3600e3;
  }
  function addDays(iso,n){var d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);
    return d.toISOString().slice(0,10);}
  function dayLong(date){return new Date(date+"T12:00:00Z")
    .toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",timeZone:"UTC"});}
  function dayOf(date){ return DAYKEYS[new Date(date+"T12:00:00Z").getUTCDay()]; }
  function weekIndexOf(date){
    for(var j=0;j<WEEKS.length;j++){
      if(date>=WEEKS[j].start && date<=addDays(WEEKS[j].start,6)) return j;
    }
    return -1;
  }
  function kindOf(label){
    if(/full show/i.test(label)) return "full";
    if(/top 10/i.test(label))    return "top10";
    return "moments";
  }

  /* ---- filter engine: one state object shared by the tuner and the day rail ---- */
  function facetOn(set,key){ var ks=Object.keys(set); return !ks.length || !!set[key]; }
  function filtersActive(){
    return !!(Object.keys(filt.promos).length||Object.keys(filt.shows).length||
              Object.keys(filt.kinds).length||Object.keys(filt.days).length||filt.q);
  }
  function hay(c){ // label + show + promo + long show name + network, so "netflix" finds Raw
    return (c.label+" "+c.show+" "+c.promo+" "+showFull(c.show)+" "+netOf(c.show)).toLowerCase();
  }
  function qMatch(h,q){ // token-AND: every word must hit
    if(!q) return true;
    return q.split(/\s+/).every(function(t){ return h.indexOf(t)>-1; });
  }
  function clipMatches(c,skip){ // skip = facet name to ignore (for per-chip counts)
    return (skip==="promos"||facetOn(filt.promos,c.promo))
        && (skip==="shows" ||facetOn(filt.shows,c.show))
        && (skip==="kinds" ||facetOn(filt.kinds,kindOf(c.label)))
        && (skip==="days"  ||facetOn(filt.days,dayOf(c.date)))
        && (skip==="q"     ||qMatch(hay(c),filt.q));
  }
  function filteredClips(wk){ return allClips(wk).filter(function(c){return clipMatches(c);}); }
  function toggleFacet(facet,val){
    if(filt[facet][val]) delete filt[facet][val]; else filt[facet][val]=true;
    lastFacetTouched=facet;
    applyFilters();
  }
  function resetFilters(){
    filt={promos:{},shows:{},kinds:{},days:{},q:""};
    var q=document.getElementById("vg-q"); if(q) q.value="";
    applyFilters();
  }
  function onFilterChange(fn){ filterListeners.push(fn); }
  function selectedDayDates(){ // filt.days weekdays mapped onto the current week's dates
    var wk=WEEKS[curIndex], out=[];
    for(var n=0;n<7;n++){
      var date=addDays(wk.start,n);
      if(filt.days[dayOf(date)]) out.push(date);
    }
    return out;
  }

  /* week_shows: ordered per-show status, pure function of a week (mirror of proposed Python helper) */
  function weekShows(wk){
    var byShow={};
    ORDER.forEach(function(p){(wk.promos[p]||[]).forEach(function(c){
      var s=showOf(c[2]);
      if(!byShow[s]) byShow[s]={show:s,promo:p,clips:[]};
      byShow[s].clips.push(c);
    });});
    var order=["SummerSlam","RAF","Raw","NXT","Dynamite","iMPACT","SmackDown","Collision"];
    return order.filter(function(s){return byShow[s];}).map(function(s){return byShow[s];});
  }
  function allClips(wk){ // day-ordered, full-show-highlight first per show
    var out=[];
    weekShows(wk).forEach(function(sh){
      var full=sh.clips.filter(function(c){return /full show/i.test(c[2]);});
      var rest=sh.clips.filter(function(c){return !/full show/i.test(c[2]);});
      full.concat(rest).forEach(function(c){out.push({promo:sh.promo,id:c[0],date:c[1],label:c[2],show:sh.show});});
    });
    out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    return out;
  }

  /* ---- facade card (mirror of facade_card) ---- */
  function card(c){
    var seen=watched[c.id]?" vg-card--seen":"";
    var flag=isNew(c.date)?'<span class="vcard__flag">NEW</span>':'';
    return '<li data-promo="'+c.promo+'" data-show="'+esc(c.show)+'" data-kind="'+kindOf(c.label)+
      '" data-day="'+dayOf(c.date)+'" data-hay="'+esc(hay(c))+'"><article class="vcard'+seen+'" data-id="'+c.id+'">'+
      '<button class="yt" type="button" data-play data-id="'+c.id+'" data-title="'+esc(vtitle(c))+'" '+
        'data-page="'+pageUrl(c.promo,c.label,c.date)+'" aria-label="Play '+esc(c.label)+', opens spoiler-safe player">'+
        '<img class="yt__thumb" src="'+thumb(c.id)+'" alt="" loading="lazy" decoding="async" width="480" height="270">'+
        '<span class="yt__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>'+
        '<span class="yt__cap">'+esc(showOf(c.label))+'</span>'+
      '</button>'+
      '<span class="vg-seen-tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>'+
      '<div class="vcard__body">'+
        '<span class="vcard__meta"><span>'+dayShort(c.date)+'</span>'+flag+'</span>'+
        '<h3 class="vcard__title">'+esc(c.label)+'</h3>'+
      '</div></article></li>';
  }
  function vtitle(c){return c.promo+" "+c.label.replace(" · ",", ")+", "+c.date;}

  function rail(items){return '<ul class="tw-rail" role="list">'+items.map(card).join("")+'</ul>';}

  function rowHTML(id,title,sub,items,moreLabel,moreHref,extraClass){
    if(!items.length) return "";
    return '<section class="vg-row '+(extraClass||"")+'" aria-label="'+esc(title)+'">'+
      '<div class="vg-row__head"><div>'+
        '<h2 class="vg-row__h">'+esc(title)+'</h2>'+
        '<span class="telemetry vg-row__sub"><b>'+esc(sub)+'</b></span>'+
      '</div>'+(moreLabel?'<a class="link-more" href="'+moreHref+'">'+esc(moreLabel)+'</a>':'')+'</div>'+
      rail(items)+'</section>';
  }

  /* ---- spotlight pick (deterministic ladder, mirror of spotlight_for) ---- */
  function spotlightPick(wk){
    var clips=allClips(wk);
    var flag=clips.filter(function(c){return c.promo==="WWE" && /full show/i.test(c.label);})[0];
    var full=clips.filter(function(c){return /full show/i.test(c.label);})[0];
    return flag||full||clips[0];
  }

  /* ============================================================
     RENDER a week
     ============================================================ */
  function render(i){
    curIndex=i;
    var wk=WEEKS[i];
    document.getElementById("crumb-week").textContent=wk.label;
    renderWeekbar(i);
    renderDayRail(i);

    var shows=weekShows(wk);
    var clips=allClips(wk);
    var spot=spotlightPick(wk);
    var aired=shows.map(function(s){return s.show;});
    var pending=SCHEDULE.filter(function(s){return aired.indexOf(s.show)<0;});
    var partial=pending.length>0;

    // hero tag variant
    var tag = partial ? ("Just aired // "+dayShort(spot.date)) : ("The main event // "+shortWeek(wk));

        '<span class="telemetry vg-spot__meta"><b>'+shows.length+' SHOWS IN'+(partial?" // "+pending.length+" STILL TO AIR":"")+'</b></span>'+
      '</div>'+
      '<div class="mh-feature brackets">'+
        '<span class="mh-tag">'+esc(tag)+'</span>'+
        '<button class="yt" type="button" data-play data-id="'+spot.id+'" data-title="'+esc(vtitle(spot))+'" data-page="'+pageUrl(spot.promo,spot.label,spot.date)+'" aria-label="Play the weekly spotlight, opens spoiler-safe player">'+
          '<img class="yt__thumb" src="'+thumb(spot.id)+'" alt="" decoding="async" width="480" height="270">'+
          '<span class="yt__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>'+
        '</button>'+

          '<span class="mh-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Press play to watch here, spoiler-safe</span>'+

    /* --- 4 COMMAND DECK: caught-up meter + shuffle + spoiler toggle + continue --- */
    html+='<section class="vg-deck brackets" aria-label="Catch-up controls">'+
      '<div class="vg-meter" id="vg-meter">'+
        '<div class="vg-meter__top">'+
          '<span class="telemetry telemetry--nom"><b>MARATHON</b></span>'+
          '<span class="vg-meter__read" id="vg-read" aria-live="polite">CAUGHT UP // 0 OF '+shows.length+' SHOWS</span>'+
        '</div>'+
        '<div class="vg-segs" id="vg-segs" role="img" aria-hidden="true">'+
          shows.map(function(){return '<span class="vg-seg"></span>';}).join("")+
        '</div>'+
        '<p class="vg-meter__note">Tracks this visit only. Cross-week streaks need an account (backend, not yet live).</p>'+
      '</div>'+
      '<div class="vg-deck__actions">'+
        '<button class="vg-btn" type="button" id="vg-shuffle"><svg viewBox="0 0 24 24"><path d="M17 3h4v4M21 3l-6 6M3 17l6-6M7 21H3v-4"/></svg>Surprise me</button>'+
        '<button class="vg-btn vg-toggle" type="button" id="vg-spoiler" aria-pressed="'+spoilersShown+'">Spoilers // '+(spoilersShown?"Shown":"Hidden")+'</button>'+
      '</div>'+
      '<div class="vg-continue" id="vg-continue"><span class="telemetry telemetry--nom"><b>THIS SESSION</b></span>'+
        '<span id="vg-continue-txt"></span></div>'+
    '</section>';

    /* --- 4b THE TUNER (filter deck) + day-filter banner slot --- */
    html+=tunerHTML(wk);
    html+='<div id="vg-dayband-slot"></div>';

    /* --- PLE COUNTDOWN band (only when a PLE is within lookahead) --- */
    if(pleInRange(wk)){
      html+='<section class="vg-clock brackets" id="vg-clock" aria-label="Next premium live event">'+
        '<div><span class="vg-clock__lbl">NEXT PREMIUM LIVE EVENT // <b>'+esc(PLE.name.toUpperCase())+'</b> · '+esc(PLE.dates.toUpperCase())+' · '+esc(PLE.venue.toUpperCase())+'</span></div>'+
        '<div class="vg-clock__t" id="vg-clock-t" aria-live="off">--<span class="u">d</span> --<span class="u">h</span> --<span class="u">m</span> --<span class="u">s</span></div>'+
      '</section>';

    /* --- 5 NEW THIS WEEK rail --- */

    /* --- 7 ROAD TO PLE rail --- */
    if(pleInRange(wk)){
      var goHome=clips.filter(function(c){return /faceoff|main event|go-home|world title|reigns|rollins/i.test(c.label);}).slice(0,4);
      var pleCard='<li><div class="vg-ple-card brackets">'+

        '<div><div class="vg-ple-card__nm">'+esc(PLE.name)+'</div>'+
        '<span class="vg-ple-card__cnt" id="vg-ple-days">Counting down</span></div>'+
        '<a class="vg-ple-card__go" href="'+PLE.href+'">Card and streaming</a></div></li>';
      var goItems=goHome.length?'<ul class="tw-rail" role="list">'+pleCard+goHome.map(card).join("")+'</ul>':
                                 '<ul class="tw-rail" role="list">'+pleCard+'</ul>';
      html+='<section class="vg-row vg-row--ple" aria-label="The road to '+esc(PLE.name)+'">'+
        '<div class="vg-row__head"><div><h2 class="vg-row__h">The road to '+esc(PLE.name)+'</h2>'+
        '<span class="telemetry vg-row__sub"><b>'+esc(PLE.dates.toUpperCase())+' · '+esc(PLE.venue.toUpperCase())+'</b></span></div></div>'+
        goItems+
        '<p class="vg-meter__note" style="margin-top:.6rem">Every go-home show feeding into the biggest weekend of the summer, in one place.</p>'+
      '</section>';
    }

    /* --- 8 UP NEXT status (partial) or full-week note --- */
    if(partial){
      html+='<div class="vg-upnext"><span class="telemetry"><b>STILL TO AIR THIS WEEK</b></span>'+
        '<ul class="vg-upnext__list">'+pending.map(function(s){
          return '<li><b>'+s.day+' · '+esc(s.show)+'</b><span>'+esc(s.net)+'</span></li>';
        }).join("")+'</ul>'+
        '<p class="vg-upnext__note">Clips land the morning after each show. Check back, or jump to a finished week above.</p></div>';
    } else {
      html+='<div class="vg-upnext"><span class="telemetry"><b>FULL WEEK IN THE BOOKS</b></span>'+
        '<p class="vg-upnext__note">Six shows captured. Clear the card, then jump to another week above.</p></div>';
    }

    /* --- 9 FULL GRID (demoted master-detail) --- */
    html+='<section class="vg-fullgrid" id="vg-fullgrid" aria-label="The full week, every clip">'+
      '<div class="vg-row__head"><div><h2 class="vg-row__h">The full week</h2>'+
      '<span class="telemetry vg-row__sub"><b>EVERY CLIP · BY PROMOTION</b></span></div></div>'+
      fullGrid(wk)+'</section>';

    /* --- 10 INSIDER (the ONE gold CTA fill) --- */
    html+='<section class="vg-insider brackets" aria-label="Insider email">'+
      '<p class="eyebrow">Catch-up desk // Monday drop</p>'+
      '<h2>The week\'s card, in your inbox</h2>'+
      '<p>One email Monday morning. Every show that aired, every clip worth your time, and what streams where. Titles stay spoiler-safe, same as the gallery.</p>'+
      '<form id="vg-insider-form"><label for="vg-email">Your email</label>'+
        '<input id="vg-email" type="email" placeholder="you@example.com" required autocomplete="email">'+
        '<button class="vg-cta-gold" type="submit">Join the Insider list</button></form>'+
      '<p class="vg-insider__flag">No results in the subject line. Leave anytime. Delivery endpoint is backend work, not wired in this prototype.</p></section>';

    /* --- footer nav --- */
    var newer=WEEKS[i-1], older=WEEKS[i+1];
    html+='<nav class="vg-foot" aria-label="Week navigation">'+
      (newer?'<button class="link-more" data-goweek="'+(i-1)+'">Newer week</button>':'')+
      '<a class="link-more" href="/gallery/">All weeks</a>'+
      (older?'<button class="link-more" data-goweek="'+(i+1)+'">Older week</button>':'')+
    '</nav>';

    root.innerHTML=html;
    wireWeek(wk,shows);
    updateMeter(shows);
    applyFilters();  // filt outlives the render; the fresh DOM is immediately re-filtered
  }

  function shortWeek(wk){return new Date(wk.start+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}).toUpperCase();}
  function showFull(s){return ({Raw:"Monday Night Raw",NXT:"WWE NXT",Dynamite:"AEW Dynamite","iMPACT":"TNA iMPACT",SmackDown:"WWE SmackDown",Collision:"AEW Collision",SummerSlam:"WWE SummerSlam",RAF:"Real American Freestyle"})[s]||s;}
  function netOf(s){return (SHOWNET[s]||["Netflix"])[0];}
  function pleInRange(wk){
    var start=new Date(wk.start+"T00:00:00Z").getTime();
    var ev=new Date(PLE.when).getTime();
    var days=(ev-start)/86400e3;
    return days>=0 && days<=21;
  }

  /* full grid (master-detail tabs) */
  function fullGrid(wk){
    var shows=weekShows(wk);
    var byPromo={};
    ORDER.forEach(function(p){if(wk.promos[p]) byPromo[p]=allClips(wk).filter(function(c){return c.promo===p;});});
    var promos=Object.keys(byPromo);
    var tabs=promos.map(function(p,i){
      return '<button class="tw-item" type="button" role="tab" id="fg-tab-'+p+'" aria-controls="fg-panel-'+p+'" aria-selected="'+(i===0)+'"'+(i?' tabindex="-1"':'')+'>'+
        '<span class="tw-item__name">'+p+'</span><span class="tw-item__net">'+esc(TABNET[p])+'</span></button>';
    }).join("");
    var panels=promos.map(function(p,i){
      return '<div class="tw-panel" role="tabpanel" id="fg-panel-'+p+'" aria-labelledby="fg-tab-'+p+'"'+(i?' hidden':'')+'>'+
        '<div class="tw-panel__head"><span class="telemetry"><b>'+esc(wk.label.toUpperCase())+' · '+p+'</b></span></div>'+
        rail(byPromo[p])+'</div>';
    }).join("");
    return '<div class="tw-layout"><div class="tw-list" role="tablist" aria-label="Choose a promotion">'+tabs+'</div><div class="tw-detail">'+panels+'</div></div>';
  }

  /* ============================================================
     THE TUNER: chip bar markup (day chips live on the bottom rail)
     ============================================================ */
  function chipBtn(facet,val,txt,accVar){
    return '<button class="vg-chip" type="button" data-facet="'+facet+'" data-val="'+esc(val)+'"'+
      (accVar?' style="--acc:var('+accVar+')"':'')+' aria-pressed="false">'+esc(txt)+
      ' <i class="vg-chip__n">0</i></button>';
  }
  function tunerHTML(wk){
    var promoChips=ORDER.map(function(p){return chipBtn("promos",p,p,"--c-"+p.toLowerCase());}).join("");
    var showChips=SCHEDULE.map(function(s){return chipBtn("shows",s.show,s.show,SHOWACC[s.show]);}).join("");
    var kindChips=chipBtn("kinds","full","Full show")+chipBtn("kinds","top10","Top 10")+
      chipBtn("kinds","moments","Matches and moments");
    return '<section class="vg-tuner brackets" id="vg-tuner" aria-label="Filter this week\'s clips">'+
      '<div class="vg-tuner__top">'+
        '<span class="telemetry telemetry--nom"><b>TUNE THE WEEK</b></span>'+
        '<span class="vg-tuner__count" id="vg-count" aria-live="polite"></span>'+
        '<button class="vg-tuner__reset" type="button" id="vg-reset" hidden>Reset filters</button>'+
      '</div>'+
      '<div class="vg-tuner__search">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>'+
        '<input id="vg-q" type="search" value="'+esc(filt.q)+'" placeholder="Search this week: shows, titles, networks" aria-label="Search this week\'s clips" autocomplete="off" spellcheck="false">'+
        '<button class="vg-tuner__qx" id="vg-qx" type="button" aria-label="Clear search" hidden>&#215;</button>'+
      '</div>'+
      '<div class="vg-facet" role="group" aria-label="Filter by promotion"><span class="vg-facet__lbl">Promotion</span>'+promoChips+'</div>'+
      '<div class="vg-facet" role="group" aria-label="Filter by show"><span class="vg-facet__lbl">Show</span>'+showChips+'</div>'+
      '<div class="vg-facet" role="group" aria-label="Filter by clip type"><span class="vg-facet__lbl">Clip type</span>'+kindChips+'</div>'+
      '<div class="vg-tuner__zero" id="vg-zero" hidden>'+
        '<span class="telemetry"><b>NO CLIPS MATCH</b></span>'+
        '<p class="vg-tuner__zerotxt" id="vg-zero-txt">Nothing this week fits that combination.</p>'+
        '<div class="vg-tuner__zeroacts" id="vg-zero-acts"></div>'+
      '</div>'+
    '</section>';
  }

  /* ============================================================
     applyFilters(): the single write path. render(i) always draws
     the week unfiltered; this walks the DOM and toggles visibility.
     ============================================================ */
  function liMatches(li){
    var d=li.dataset;
    return facetOn(filt.promos,d.promo) && facetOn(filt.shows,d.show)
        && facetOn(filt.kinds,d.kind)  && facetOn(filt.days,d.day)
        && qMatch(d.hay,filt.q);
  }
  function applyFilters(){
    var wk=WEEKS[curIndex];
    var clips=allClips(wk), total=clips.length;
    var vis=clips.filter(function(c){return clipMatches(c);});
    var shown=vis.length, showsHit={};
    vis.forEach(function(c){showsHit[c.show]=true;});
    document.querySelectorAll('#week-root li[data-promo]').forEach(function(li){
      li.hidden=!liMatches(li);
    });
    // hide any row whose rail is now empty (PLE row survives via its promo-less card)
    document.querySelectorAll('#week-root .vg-row').forEach(function(sec){
      var r=sec.querySelector(".tw-rail");
      var visN=r?r.querySelectorAll(":scope>li:not([hidden])").length:0;
      sec.classList.toggle("is-filtered-out",!visN);
    });
    // full grid: dim empty promo tabs, hop off a dead tab
    var tabs=document.querySelectorAll('#vg-fullgrid [role="tab"]'), firstLive=null, curDead=false;
    tabs.forEach(function(t){
      var panel=document.getElementById(t.getAttribute("aria-controls"));
      var visN=panel?panel.querySelectorAll(".tw-rail>li:not([hidden])").length:0;
      t.classList.toggle("is-void",!visN);
      if(visN&&!firstLive) firstLive=t;
      if(!visN&&t.getAttribute("aria-selected")==="true") curDead=true;
    });
    if(curDead&&firstLive) firstLive.click();
    // count line
    var cnt=document.getElementById("vg-count");
    var nsh=Object.keys(showsHit).length;
    if(cnt) cnt.textContent = filtersActive()
      ? "SHOWING "+shown+" OF "+total+" CLIPS // "+nsh+" SHOW"+(nsh===1?"":"S")
      : "ALL "+total+" CLIPS // "+weekShows(wk).length+" SHOWS";
    // reset visibility + shuffle arming + search clear
    var rst=document.getElementById("vg-reset"); if(rst) rst.hidden=!filtersActive();
    var sh=document.getElementById("vg-shuffle"); if(sh) sh.disabled=(shown===0&&filtersActive());
    var qx=document.getElementById("vg-qx"); if(qx) qx.hidden=!filt.q;
    updateChipCounts(wk);
    zeroState(wk,shown);
    syncChipStates();
    updateDayband(vis);
    updateMeter(meterShows());
    syncHash();
    filterListeners.forEach(function(f){f(filt);});   // wake the day rail
  }
  function syncChipStates(){
    document.querySelectorAll("#vg-tuner .vg-chip").forEach(function(ch){
      ch.setAttribute("aria-pressed",String(!!filt[ch.dataset.facet][ch.dataset.val]));
    });
  }
  function updateChipCounts(wk){ // per-chip counts under the OTHER active facets
    var clips=allClips(wk);
    document.querySelectorAll("#vg-tuner .vg-chip").forEach(function(ch){
      var f=ch.dataset.facet,v=ch.dataset.val,n=0;
      clips.forEach(function(c){
        var key=f==="promos"?c.promo:f==="shows"?c.show:f==="kinds"?kindOf(c.label):dayOf(c.date);
        if(key===v&&clipMatches(c,f)) n++;
      });
      var elN=ch.querySelector(".vg-chip__n"); if(elN) elN.textContent=n;
      ch.classList.toggle("is-void",!n);
    });
  }

  /* ---- zero-result escape hatch: name the facet to drop, or hop weeks ---- */
  function zeroState(wk,shown){
    var box=document.getElementById("vg-zero"), acts=document.getElementById("vg-zero-acts");
    if(!box||!acts) return;
    box.hidden=!(shown===0&&filtersActive());
    if(box.hidden){acts.innerHTML="";return;}
    var clips=allClips(wk);
    var b='<button class="vg-btn" type="button" data-zero="reset">Show all '+clips.length+' clips</button>';
    var names={q:"search",days:"day",kinds:"clip type",shows:"show",promos:"promotion"};
    // 1: which single facet, if cleared, brings clips back?
    ["q","days","kinds","shows","promos"].some(function(f){
      var active=f==="q"?!!filt.q:!!Object.keys(filt[f]).length;
      if(!active) return false;
      var n=clips.filter(function(c){return clipMatches(c,f);}).length;
      if(!n) return false;
      b+='<button class="vg-btn" type="button" data-zero="clear" data-zf="'+f+'">Drop the '+names[f]+' filter // '+n+' clips</button>';
      return true;
    });
    // 2: does another week satisfy this exact filter?
    for(var j=0;j<WEEKS.length;j++){
      if(j===curIndex) continue;
      var n2=filteredClips(WEEKS[j]).length;
      if(n2){b+='<button class="vg-btn" type="button" data-zero="week" data-zw="'+j+'">This filter hits '+n2+' clips in the '+esc(WEEKS[j].label.toLowerCase())+'</button>';break;}
    }
    acts.innerHTML=b;
    acts.querySelectorAll("[data-zero]").forEach(function(x){
      x.addEventListener("click",function(){
        var z=x.getAttribute("data-zero");
        if(z==="reset"){resetFilters();}
        else if(z==="clear"){
          var f=x.getAttribute("data-zf");
          if(f==="q"){filt.q="";var q=document.getElementById("vg-q");if(q)q.value="";}
          else filt[f]={};
          applyFilters();
        } else {
          render(+x.getAttribute("data-zw"));
          window.scrollTo({top:0,behavior:"smooth"});
        }
      });
    });
  }

  /* ---- ONE NIGHT banner under the tuner while a night is picked ---- */
  function updateDayband(vis){
    var slot=document.getElementById("vg-dayband-slot");
    if(!slot) return;
    var days=Object.keys(filt.days);
    if(!days.length){slot.innerHTML="";return;}
    var dates=selectedDayDates();
    var lbl=(days.length===1&&dates.length)?dayShort(dates[0]):days.join(" / ").toUpperCase();
    var showsIn=[]; vis.forEach(function(c){if(showsIn.indexOf(c.show)<0)showsIn.push(c.show);});
    slot.innerHTML='<div class="vg-dayband" role="status"><span class="telemetry"><b>'+
      (days.length===1?"ONE NIGHT // ":"NIGHTS // ")+esc(lbl)+'</b></span>'+
      '<span class="vg-dayband__n">'+vis.length+' clip'+(vis.length===1?"":"s")+
      (showsIn.length?' from '+esc(showsIn.join(" and ")):'')+
      '. Share this night with the link in your address bar.</span>'+
      '<button class="vg-btn" type="button" id="vg-dayclear">Show the full week</button></div>';
  }

  /* ---- meter view: the caught-up meter respects active filters ---- */
  function meterShows(){
    var shows=weekShows(WEEKS[curIndex]);
    if(!filtersActive()) return shows;
    var out=[];
    shows.forEach(function(sh){
      var kept=sh.clips.filter(function(c){
        return clipMatches({promo:sh.promo,id:c[0],date:c[1],label:c[2],show:sh.show});
      });
      if(kept.length) out.push({show:sh.show,promo:sh.promo,clips:kept});
    });
    return out;
  }

  /* ============================================================
     STICKY DAY RAIL: bottom dock tune-in calendar
     ============================================================ */
  function weekDays(wk){ // 7 chips, Mon..Sun, pure function of the week
    var byDate={};
    ORDER.forEach(function(p){(wk.promos[p]||[]).forEach(function(c){
      (byDate[c[1]]=byDate[c[1]]||[]).push(c);});});
    var today=new Date().toISOString().slice(0,10);
    return "Mon Tue Wed Thu Fri Sat Sun".split(" ").map(function(dw,n){
      var date=addDays(wk.start,n);
      return {date:date,dw:dw,dnum:+date.slice(8),sched:SCHEDULE[n]||null,
              special:SPECIALS[date]||null,clips:(byDate[date]||[]).length,
              past:date<today,today:date===today};
    });
  }
  function renderDayRail(i){
    var dock=document.getElementById("vg-dr-dock");
    if(!dock) return;
    var chips=weekDays(WEEKS[i]).map(function(d){
      var showNm=d.sched?d.sched.show:(d.special?d.special.nm:"");
      var net=d.sched?d.sched.net:(d.special?d.special.net:"");
      var acc=d.sched?("var("+DAYACC[d.dw]+")"):(d.special?"var(--c-gold)":"var(--c-line-strong)");
      var ple=d.special?'<span class="vg-dr__ple">PLE</span>':'';
      var cls,st,click=false;
      if(d.clips){cls="vg-dr__day--on";st=d.clips+(d.clips>1?" clips":" clip");click=true;}
      else if((d.sched||d.special)&&d.past){cls="vg-dr__day--wait";st="Clips landing soon";}
      else if(d.sched||d.special){cls="vg-dr__day--soon";
        st=(d.today?"Tonight":"Airs "+d.dw)+(net?" on "+net:"");}
      else {cls="vg-dr__day--off";st="No TV tonight";}
      var head='<span class="vg-dr__head"><span class="vg-dr__dw">'+d.dw+'</span>'+
        '<span class="vg-dr__dn">'+d.dnum+'</span>'+ple+'</span>'+
        (showNm?'<span class="vg-dr__show">'+esc(showNm)+'</span>':'')+
        '<span class="vg-dr__st">'+esc(st)+'</span>';
      if(click){
        var on=!!filt.days[d.dw];
        return '<li><button class="vg-dr__day '+cls+'" type="button" data-day="'+d.date+'" data-clips="'+d.clips+'"'+
          ' aria-pressed="'+on+'" style="--acc:'+acc+'"'+
          ' aria-label="'+esc(dayLong(d.date)+", "+showNm+", "+st+
            (on?", filter active, press to show the full week":", press to see this night only"))+'">'+
          head+'</button></li>';
      }
      return '<li><span class="vg-dr__day '+cls+'" style="--acc:'+acc+'">'+head+'</span></li>';
    }).join("");
    var newer=i>0, older=i<WEEKS.length-1;
    dock.innerHTML=
      (newer?'<button class="vg-dr__nav" type="button" data-goweek="'+(i-1)+'">Newer week</button>'
            :'<span class="vg-dr__nav is-off">Newer week</span>')+
      '<ol class="vg-dr__days" role="list">'+chips+'</ol>'+
      (older?'<button class="vg-dr__nav" type="button" data-goweek="'+(i+1)+'">Older week</button>'
            :'<span class="vg-dr__nav is-off">Older week</span>');
  }
  function syncDayRail(){ // rail chips mirror filt.days; counts respect the other facets
    var wk=WEEKS[curIndex], clips=allClips(wk);
    document.querySelectorAll("#vg-dr-dock button.vg-dr__day--on").forEach(function(b){
      var date=b.getAttribute("data-day"), dw=dayOf(date);
      b.setAttribute("aria-pressed",String(!!filt.days[dw]));
      var st=b.querySelector(".vg-dr__st");
      if(st){
        var tot=+b.getAttribute("data-clips")||0;
        var n=clips.filter(function(c){return c.date===date && clipMatches(c,"days");}).length;
        st.textContent=(n===tot)?(tot+(tot===1?" clip":" clips")):(n+" of "+tot+" clips");
      }
    });
  }

  /* ---- deep links: #d=YYYY-MM-DD[,YYYY-MM-DD] (tolerates ?day=) ---- */
  function hashParams(){return new URLSearchParams(location.hash.replace(/^#/,""));}
  function parseDayParam(d){
    if(!d) return null;
    var parts=d.split(",").filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x);});
    if(!parts.length) return null;
    var j=weekIndexOf(parts[0]);
    if(j<0) return null;
    var days={};
    parts.forEach(function(x){ if(weekIndexOf(x)===j) days[dayOf(x)]=true; });
    return {idx:j,days:days};
  }
  function syncHash(){
    var raw=location.hash.replace(/^#/,"");
    var dates=selectedDayDates();
    if(raw && raw.indexOf("=")<0 && !dates.length) return;  // leave plain #anchor jumps alone
    var p=hashParams();
    if(raw.indexOf("=")<0) p=new URLSearchParams();          // replacing an anchor hash
    if(dates.length) p.set("d",dates.join(",")); else p.delete("d");
    var q=new URLSearchParams(location.search); q.delete("day"); // normalize ?day= into #d=
    var qs=q.toString(), hs=p.toString();
    history.replaceState(null,"",location.pathname+(qs?"?"+qs:"")+(hs?"#"+hs:""));
  }

  /* ---- week switcher ---- */
  function renderWeekbar(i){
    var bar=document.getElementById("weekbar");
    var newer=i>0, older=i<WEEKS.length-1;
    var chips=WEEKS.map(function(w,j){
      var cur=j===i;
      var short=new Date(w.week+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
      return '<button class="lf-wb__wk'+(cur?" is-cur":"")+'" type="button" data-goweek="'+j+'"'+(cur?' aria-current="page"':'')+'>'+
        short+(j===0?'<span class="lf-wb__live">CURRENT</span>':'')+'</button>';
    }).join("");
    bar.innerHTML=
      (newer?'<button class="lf-wb__nav" type="button" data-goweek="'+(i-1)+'">Newer week</button>':'<span class="lf-wb__nav is-off">Newer week</span>')+
      '<div class="lf-wb__track">'+chips+'</div>'+
      (older?'<button class="lf-wb__nav" type="button" data-goweek="'+(i+1)+'">Older week</button>':'<span class="lf-wb__nav is-off">Older week</span>');
  }

  /* ============================================================
     WIRING
     ============================================================ */
  function wireWeek(wk,shows){
    var root=document.getElementById("main");
    // week nav (weekbar + footer)
    document.querySelectorAll("[data-goweek]").forEach(function(b){
      b.addEventListener("click",function(){var j=+b.getAttribute("data-goweek");render(j);window.scrollTo({top:0,behavior:"smooth"});});
    });
    // play facades
    root.querySelectorAll("[data-play]").forEach(function(b){
      b.addEventListener("click",function(){
        openModal(b.getAttribute("data-id"),b.getAttribute("data-title"),b.getAttribute("data-page"));
      });
    });
    // shuffle: Surprise Me obeys the tuner, drawing only from filtered unwatched clips
    var sh=document.getElementById("vg-shuffle");
    if(sh) sh.addEventListener("click",function(){
      var pool=filteredClips(wk).filter(function(c){return !watched[c.id];});
      if(!pool.length) pool=filteredClips(wk);  // all filtered clips seen: reshuffle within filter
      if(!pool.length) return;                  // zero-match: button is disabled anyway
      var pick=pool[Math.floor(Math.random()*pool.length)];
      openModal(pick.id,vtitle(pick),pageUrl(pick.promo,pick.label,pick.date));
    });
    // tuner
    wireTuner();
    // ONE NIGHT banner clear (delegated; banner is rebuilt by applyFilters)
    var slot=document.getElementById("vg-dayband-slot");
    if(slot) slot.addEventListener("click",function(e){
      if(e.target && e.target.id==="vg-dayclear"){filt.days={};applyFilters();}
    });
    // spoiler toggle
    var sp=document.getElementById("vg-spoiler");
    if(sp) sp.addEventListener("click",function(){
      spoilersShown=!spoilersShown;
      sp.setAttribute("aria-pressed",String(spoilersShown));
      sp.textContent="Spoilers // "+(spoilersShown?"Shown":"Hidden");
      root.classList.toggle("is-spoilers-shown",spoilersShown);
    });
    root.classList.toggle("is-spoilers-shown",spoilersShown);
    // full-grid tabs
    wireTabs(document.querySelector(".tw-list"));
    // insider
    var form=document.getElementById("vg-insider-form");
    if(form) form.addEventListener("submit",function(e){
      e.preventDefault();
      form.innerHTML='<p class="telemetry" style="font-size:11px"><b>REQUEST NOTED // this visit</b></p>';
    });
    // PLE clock
    startClock();
  }

  function wireTuner(){
    var tuner=document.getElementById("vg-tuner");
    if(!tuner) return;
    tuner.querySelectorAll(".vg-chip").forEach(function(ch){
      ch.addEventListener("click",function(){toggleFacet(ch.dataset.facet,ch.dataset.val);});
    });
    var q=document.getElementById("vg-q"), qx=document.getElementById("vg-qx"), qt=null;
    if(q){
      q.value=filt.q;
      q.addEventListener("input",function(){
        clearTimeout(qt);
        qt=setTimeout(function(){
          filt.q=q.value.trim().toLowerCase();
          lastFacetTouched="q";
          applyFilters();
        },120);
      });
      q.addEventListener("keydown",function(e){
        if(e.key==="Escape"&&(q.value||filt.q)){
          e.stopPropagation();
          q.value=""; filt.q=""; applyFilters();
        }
      });
    }
    if(qx) qx.addEventListener("click",function(){
      if(q){q.value="";q.focus();}
      filt.q=""; applyFilters();
    });
    var rst=document.getElementById("vg-reset");
    if(rst) rst.addEventListener("click",resetFilters);
  }

  function wireTabs(list){
    if(!list) return;
    var tabs=[].slice.call(list.querySelectorAll('[role="tab"]'));
    function select(t){
      tabs.forEach(function(x){
        var on=x===t;
        x.setAttribute("aria-selected",String(on));
        x.tabIndex=on?0:-1;
        var panel=document.getElementById(x.getAttribute("aria-controls"));
        if(panel) panel.hidden=!on;
      });
    }
    tabs.forEach(function(t,i){
      t.addEventListener("click",function(){select(t);});
      t.addEventListener("keydown",function(e){
        var n;
        if(e.key==="ArrowRight"||e.key==="ArrowDown") n=tabs[(i+1)%tabs.length];
        else if(e.key==="ArrowLeft"||e.key==="ArrowUp") n=tabs[(i-1+tabs.length)%tabs.length];
        if(n){e.preventDefault();select(n);n.focus();}
      });
    });
  }

  /* ---- meter / gamification (session-only) ---- */
  function updateMeter(shows){
    var done=0;
    var segsBox=document.getElementById("vg-segs");
    if(segsBox && segsBox.children.length!==shows.length){ // filters can narrow the show set
      segsBox.innerHTML=shows.map(function(){return '<span class="vg-seg"></span>';}).join("");
    }
    var segs=document.querySelectorAll("#vg-segs .vg-seg");
    shows.forEach(function(sh,i){
      var got=sh.clips.some(function(c){return watched[c[0]];});
      if(got) done++;
      if(segs[i]) segs[i].classList.toggle("is-on",got);
    });
    var read=document.getElementById("vg-read");
    var meter=document.getElementById("vg-meter");
    if(read){
      var inView=filtersActive()?" IN VIEW":"";
      if(done===shows.length && shows.length){
        read.textContent=filtersActive()
          ? "CAUGHT UP // ALL "+shows.length+" SHOW"+(shows.length===1?"":"S")+" IN VIEW"
          : "CAUGHT UP ON THE WEEK OF "+shortWeek(WEEKS[curIndex]);
        meter.classList.add("is-done");
      } else {
        read.textContent="CAUGHT UP // "+done+" OF "+shows.length+" SHOWS"+inView;
        meter.classList.remove("is-done");
      }
    }
    // mark seen cards
    Object.keys(watched).forEach(function(id){
      document.querySelectorAll('.vcard[data-id="'+cssEsc(id)+'"]').forEach(function(c){c.classList.add("vg-card--seen");});
    });
    // continue chip
    if(lastPlayed){
      var box=document.getElementById("vg-continue");
      var txt=document.getElementById("vg-continue-txt");
      if(box&&txt){box.classList.add("is-on");
        txt.innerHTML='<a href="'+lastPlayed.page+'">Jump back in: '+esc(lastPlayed.title)+'</a>';}
    }
  }
  function cssEsc(s){return s.replace(/["\\]/g,"\\$&");}

  /* ============================================================
     THEATER MODAL (focus-trapped; mirrors media.js openModal)
     ============================================================ */
  var modal=document.getElementById("wl-modal"), stage=document.getElementById("wl-stage"),
      mTitle=document.getElementById("wl-modal-t"), lastFocus=null;
  function openModal(id,title,page){
    if(!id) return;
    lastFocus=document.activeElement;
    mTitle.textContent=title||"Now playing";
    stage.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+
      '?autoplay=1&rel=0&playsinline=1" title="'+esc(title||"video")+'" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    modal.hidden=false; modal.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    modal.querySelector(".wl-modal__close").focus();
    // session gamification
    watched[id]=true;
    lastPlayed={id:id,title:title,page:page||"/gallery/"};
    updateMeter(meterShows());
  }
  function closeModal(){
    modal.hidden=true; modal.setAttribute("aria-hidden","true");
    stage.innerHTML=""; document.body.style.overflow="";
    if(lastFocus&&lastFocus.focus) lastFocus.focus();
  }
  modal.querySelectorAll("[data-close]").forEach(function(b){b.addEventListener("click",closeModal);});
  document.addEventListener("keydown",function(e){
    if(modal.hidden) return;
    if(e.key==="Escape"){closeModal();return;}
    if(e.key==="Tab"){ // focus trap
      var f=modal.querySelectorAll('button, iframe, [href], input, [tabindex]:not([tabindex="-1"])');
      f=[].slice.call(f).filter(function(x){return x.offsetParent!==null||x.tagName==="IFRAME";});
      if(!f.length) return;
      var first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });

  /* ---- PLE live countdown ---- */
  var clockTimer=null;
  function startClock(){
    if(clockTimer) clearInterval(clockTimer);
    var t=document.getElementById("vg-clock-t");
    var band=document.getElementById("vg-clock");
    var daysEl=document.getElementById("vg-ple-days");
    if(!t&&!daysEl) return;
    function tick(){
      var diff=new Date(PLE.when).getTime()-Date.now();
      if(diff<=0){
        if(band){band.classList.add("is-live");}
        if(t) t.innerHTML='LIVE NOW';
        if(daysEl) daysEl.textContent="Live now";
        return;
      }
      var d=Math.floor(diff/86400e3), h=Math.floor(diff/3600e3)%24,
          m=Math.floor(diff/60e3)%60, s=Math.floor(diff/1e3)%60;
      var p=function(n){return (n<10?"0":"")+n;};
      if(t) t.innerHTML='T-MINUS '+p(d)+'<span class="u">d</span> '+p(h)+'<span class="u">h</span> '+p(m)+'<span class="u">m</span> '+p(s)+'<span class="u">s</span>';
      if(daysEl) daysEl.textContent=d+" days out";
    }
    tick(); clockTimer=setInterval(tick,1000);
  }

  /* ---- day rail wiring: chips share filt.days with the tuner ---- */
  document.getElementById("vg-dr-dock").addEventListener("click",function(e){
    var b=e.target.closest("button.vg-dr__day--on");
    if(!b) return;
    var dw=dayOf(b.getAttribute("data-day"));
    toggleFacet("days",dw);
    if(filt.days[dw]){
      var row=document.querySelector("#week-root .vg-row:not(.is-filtered-out)");
      if(row&&row.scrollIntoView) row.scrollIntoView({behavior:"smooth",block:"start"});
    }
  });
  onFilterChange(syncDayRail);
  /* collapse tab (session-only, no storage) */
  var railEl=document.getElementById("vg-dayrail"), railTab=document.getElementById("vg-dr-tab");
  railTab.addEventListener("click",function(){
    railCollapsed=!railCollapsed;
    railEl.classList.toggle("is-collapsed",railCollapsed);
    document.body.classList.toggle("rail-collapsed",railCollapsed);
    railTab.setAttribute("aria-expanded",String(!railCollapsed));
    railTab.textContent=railCollapsed?"Show week rail":"Hide week rail";
  });
  /* back/forward + hand-edited hashes; ignores plain #anchor hashes */
  window.addEventListener("hashchange",function(){
    var raw=location.hash.replace(/^#/,"");
    if(raw && raw.indexOf("=")<0) return;
    var d=hashParams().get("d")||"";
    if(d===selectedDayDates().join(",")) return;
    var parsed=parseDayParam(d);
    if(parsed){filt.days=parsed.days; render(parsed.idx); return;}
    filt.days={}; applyFilters();
  });

  /* boot: a day deep link picks the week AND the night; #watch= keys are preserved */
  document.body.classList.add("has-dayrail");
  (function boot(){
    var p=hashParams();
    var d=p.get("d")||new URLSearchParams(location.search).get("day")||"";
    var idx={{INIT_WEEK}};
    var parsed=parseDayParam(d);
    if(parsed){idx=parsed.idx; filt.days=parsed.days;}
    render(idx);
    if(parsed){
      var row=document.querySelector("#week-root .vg-row:not(.is-filtered-out)");
      if(row&&row.scrollIntoView) row.scrollIntoView({block:"start"});
    }
    var w=p.get("watch");   // coexistence: if a watch id resolves, open the theater
    if(w){
      var hit=null;
      WEEKS.forEach(function(wk2){ORDER.forEach(function(pr){(wk2.promos[pr]||[]).forEach(function(c){
        if(c[0]===w) hit={promo:pr,id:c[0],date:c[1],label:c[2],show:showOf(c[2])};});});});
      if(hit) openModal(hit.id,vtitle(hit),pageUrl(hit.promo,hit.label,hit.date));
    }
  })();
})();
</script>
