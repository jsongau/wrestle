<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="sk-t" id="sk-r">
<title id="sk-t">Spotlight cone, high-kick arc, pom bursts and ring-apron ropes</title>
<style>
#sk-r .sk-sw{animation:sk-sw 12s ease-in-out infinite}
@keyframes sk-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#sk-r .sk-cone{transform-origin:150px 0;animation:sk-cone 12s ease-in-out infinite}
@keyframes sk-cone{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
#sk-r .sk-k{stroke-dasharray:100 100;animation:sk-k 9s cubic-bezier(.5,0,.2,1) infinite}
@keyframes sk-k{0%{stroke-dashoffset:100}35%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
#sk-r .sk-toe{animation:sk-toe 9s ease-in-out infinite}
@keyframes sk-toe{0%,25%{opacity:0}36%,78%{opacity:1}95%,100%{opacity:0}}
#sk-r .sk-pom{transform-box:fill-box;transform-origin:center;animation:sk-pom 10s ease-in-out infinite}
#sk-r .sk-pom2{animation-delay:-5s}
@keyframes sk-pom{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(14deg) scale(1.08)}}
@media (prefers-reduced-motion:reduce){#sk-r,#sk-r *{animation:none!important}}
</style>
