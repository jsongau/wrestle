" y="236" width="4" height="4" fill="#f2cc4b" transform="rotate(45 234 238)"/><rect class="rt-sp" style="animation-delay:-5.5s" x="70" y="212" width="4" height="4" fill="#fff" transform="rotate(45 72 214)"/>
