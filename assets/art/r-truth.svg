<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="rt-t" id="rt-r">
<title id="rt-t">Party microphone, spinning clock face and rhythm bars</title>
<style>
#rt-r .rt-sw{animation:rt-sw 12s ease-in-out infinite}
@keyframes rt-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#rt-r .rt-ring{transform-origin:150px 124px;animation:rt-spin 14s linear infinite}
#rt-r .rt-min{transform-origin:150px 124px;animation:rt-spin 12s linear infinite}
@keyframes rt-spin{to{transform:rotate(360deg)}}
#rt-r .rt-b{transform-box:fill-box;transform-origin:50% 100%;animation:rt-b 8s ease-in-out infinite}
@keyframes rt-b{0%,100%{transform:scaleY(1)}12%{transform:scaleY(.55)}25%{transform:scaleY(.9)}37%{transform:scaleY(.45)}50%{transform:scaleY(.95)}62%{transform:scaleY(.6)}75%{transform:scaleY(.85)}87%{transform:scaleY(.5)}}
#rt-r .rt-mic{transform-origin:176px 254px;animation:rt-mic 7s ease-in-out infinite}
@keyframes rt-mic{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
#rt-r .rt-sp{animation:rt-sp 6s ease-in-out infinite}
@keyframes rt-sp{0%,100%{opacity:.7}50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){#rt-r,#rt-r *{animation:none!important}}
</style>
<defs>
<radialGradient id="rt-g" cx=".5" cy=".22" r=".62"><stop offset="0" stop-color="#f2cc4b" stop-opacity=".16"/><stop offset="1" stop-color="#f2cc4b" stop-opacity="0"/></radialGradient>
<linearGradient id="rt-f" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0a0b0d" stop-opacity="0"/><stop offset=".7" stop-color="#0a0b0d" stop-opacity=".96"/><stop offset="1" stop-color="#0a0b0d"/></linearGradient>
<linearGradient id="rt-s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="rt-h" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" fill="#fff" fill-opacity=".06"/></pattern>
<clipPath id="rt-c"><rect width="300" height="280"/></clipPath>
<clipPath id="rt-hc"><circle cx="0" cy="0" r="17"/></clipPath>
</defs>
