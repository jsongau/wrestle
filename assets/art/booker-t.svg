<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="bt-t" id="bt-r">
<title id="bt-t">Spinaroonie disc of concentric arcs, scissors-kick X, geometric crown</title>
<style>
#bt-r .bt-sw{animation:bt-sw 12s ease-in-out infinite}
@keyframes bt-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#bt-r .bt-a{transform-origin:150px 140px;animation:bt-spin 8s linear infinite}
#bt-r .bt-b{transform-origin:150px 140px;animation:bt-spin 12s linear infinite reverse}
#bt-r .bt-c{transform-origin:150px 140px;animation:bt-spin 14s linear infinite}
@keyframes bt-spin{to{transform:rotate(360deg)}}
#bt-r .bt-k{stroke-dasharray:100 100;animation:bt-k 9s cubic-bezier(.55,0,.2,1) infinite}
@keyframes bt-k{0%{stroke-dashoffset:100}32%,76%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
#bt-r .bt-k2{animation-delay:-.6s}
#bt-r .bt-hit{transform-box:fill-box;transform-origin:center;animation:bt-hit 9s ease-out infinite}
@keyframes bt-hit{0%,33%{transform:scale(.4);opacity:0}36%{opacity:.9}63%,100%{transform:scale(1.5);opacity:0}}
#bt-r .bt-cr{animation:bt-cr 10s ease-in-out infinite}
@keyframes bt-cr{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#bt-r,#bt-r *{animation:none!important}}
</style>
<defs>
<radialGradient id="bt-g" cx=".5" cy=".22" r=".62"><stop offset="0" stop-color="#f2cc4b" stop-opacity=".16"/><stop offset="1" stop-color="#f2cc4b" stop-opacity="0"/></radialGradient>
<linearGradient id="bt-f" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0a0b0d" stop-opacity="0"/><stop offset=".7" stop-color="#0a0b0d" stop-opacity=".96"/><stop offset="1" stop-color="#0a0b0d"/></linearGradient>
<linearGradient id="bt-s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="bt-h" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" fill="#fff" fill-opacity=".06"/></pattern>
<clipPath id="bt-c"><rect width="300" height="280"/></clipPath>
<linearGradient id="bt-kg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e2b13c" stop-opacity=".15"/><stop offset="1" stop-color="#f2cc4b"/></linearGradient>
</defs>
<rect width="300" height="400" fill="#0a0b0d"/>
<rect width="300" height="400" fill="url(#bt-g)"/>
<g class="bt-cr"><path d="M112 64L106 36L128 50L150 28L172 50L194 36L188 64Z" fill="#d4af37" fill-opacity=".1" stroke="#f2cc4b" stroke-width="2" stroke-linejoin="round"/>
<g fill="#f2cc4b"><circle cx="106" cy="36" r="3"/><circle cx="150" cy="28" r="3.4"/><circle cx="194" cy="36" r="3"/></g><path d="M114 58H186" stroke="#f2cc4b" stroke-opacity=".5"/></g>
<circle cx="150" cy="140" r="72" fill="#e2b13c" fill-opacity=".05" stroke="#d4af37" stroke-opacity=".2"/>
<g fill="none" stroke-width="2.6" stroke-linecap="round"><g class="bt-a"><path d="M167.7 143.1A18 18 0 1 1 150 122" stroke="#fff" stroke-opacity=".6"/><path d="M171 176.4A42 42 0 1 1 192 140" stroke="#e2b13c" stroke-opacity=".6"/></g><g class="bt-b"><path d="M127 159.3A30 30 0 1 1 178.2 129.7" stroke="#f2cc4b" stroke-opacity=".85"/><path d="M85 128.5A66 66 0 1 1 183 197.2" stroke="#d4af37" stroke-opacity=".6"/></g><g class="bt-c"><path d="M131.5 89.3A54 54 0 0 1 191.4 174.7" stroke="#fff" stroke-opacity=".35"/></g></g>
<circle cx="150" cy="140" r="4" fill="#fff"/>
<g fill="none" stroke-linecap="round" stroke-width="3.2">
<path class="bt-k" pathLength="100" d="M40 250Q150 196 260 214" stroke="url(#bt-kg)"/>
<path class="bt-k bt-k2" pathLength="100" d="M40 214Q150 196 260 250" stroke="url(#bt-kg)"/></g>
<circle class="bt-hit" cx="150" cy="214" r="14" fill="none" stroke="#f2cc4b" stroke-width="2"/>
<rect width="300" height="280" fill="url(#bt-h)"/>
<g clip-path="url(#bt-c)"><g transform="skewX(-16)"><rect class="bt-sw" x="-60" y="0" width="70" height="300" fill="url(#bt-s)"/></g></g>
<rect width="300" height="400" fill="url(#bt-f)"/>
<rect x="10.5" y="10.5" width="279" height="379" rx="12" fill="none" stroke="#d4af37" stroke-opacity=".38"/>
<path d="M22 10.5h40M238 389.5h40" stroke="#f2cc4b" stroke-opacity=".7"/>
</svg>
