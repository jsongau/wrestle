<title id="nn-t">Show-off zig-zag, superkick arc, ladder with hanging briefcase</title>
<style>
#nn-r .nn-sw{animation:nn-sw 12s ease-in-out infinite}
@keyframes nn-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#nn-r .nn-zh{stroke-dasharray:14 86;animation:nn-zh 7s linear infinite}
@keyframes nn-zh{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
#nn-r .nn-k{stroke-dasharray:100 100;animation:nn-k 9s cubic-bezier(.6,0,.2,1) infinite}
@keyframes nn-k{0%{stroke-dashoffset:100}30%,76%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
#nn-r .nn-hit{transform-box:fill-box;transform-origin:center;animation:nn-hit 9s ease-out infinite}
@keyframes nn-hit{0%,28%{transform:scale(.4);opacity:0}32%{opacity:.9}60%,100%{transform:scale(1.5);opacity:0}}
#nn-r .nn-bc{transform-origin:212px 10px;animation:nn-bc 8s ease-in-out infinite}
@keyframes nn-bc{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){#nn-r,#nn-r *{animation:none!important}}
</style>
