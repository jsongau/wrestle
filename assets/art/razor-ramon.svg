<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="rr-t" id="rr-r">
<title id="rr-t">Toothpick-thin gold diagonal, ladder, chain links and a flicked coin glint</title>
<style>
#rr-r .rr-sw{animation:rr-sw 12s ease-in-out infinite}
@keyframes rr-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#rr-r .rr-ch{transform-origin:174px 36px;animation:rr-ch 9s ease-in-out infinite}
@keyframes rr-ch{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
#rr-r .rr-sh{stroke-dasharray:8 92;animation:rr-sh 10s ease-in-out infinite}
@keyframes rr-sh{0%,20%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
#rr-r .rr-coin{transform-box:fill-box;transform-origin:center;animation:rr-coin 11s ease-in-out infinite}
@keyframes rr-coin{0%,62%,100%{transform:translateY(0) scaleX(1)}70%{transform:translateY(-22px) scaleX(.08)}78%{transform:translateY(-30px) scaleX(1)}86%{transform:translateY(-14px) scaleX(.08)}94%{transform:translateY(0) scaleX(1)}}
#rr-r .rr-gn{transform-box:fill-box;transform-origin:center;animation:rr-gn 11s ease-out infinite}
@keyframes rr-gn{0%,92%{opacity:0;transform:scale(.3)}95%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){#rr-r,#rr-r *{animation:none!important}}
</style>
