<style>
#hu-r .hu-sw{animation:hu-sw 12s ease-in-out infinite}
@keyframes hu-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#hu-r .hu-sp{transform-origin:150px 128px;animation:hu-spin 14s linear infinite reverse}
@keyframes hu-spin{to{transform:rotate(360deg)}}
#hu-r .hu-cape{transform-origin:282px 30px;animation:hu-cape 8s ease-in-out infinite}
@keyframes hu-cape{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
#hu-r .hu-z{animation:hu-z 9s linear infinite}
#hu-r .hu-z2{animation-delay:-4.5s}
@keyframes hu-z{0%,58%,74%,100%{opacity:.2}60%,65%{opacity:1}62%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#hu-r,#hu-r *{animation:none!important}}
</style>
