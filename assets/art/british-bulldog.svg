<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-labelledby="bb-t" id="bb-r">
<title id="bb-t">Running powerslam arc, studded collar ring, stadium light row</title>
<style>
#bb-r .bb-sw{animation:bb-sw 12s ease-in-out infinite}
@keyframes bb-sw{0%{transform:translateX(-120px)}55%,100%{transform:translateX(480px)}}
#bb-r .bb-l{animation:bb-l 8s ease-in-out infinite}
@keyframes bb-l{0%,100%{opacity:.55}50%{opacity:1}}
#bb-r .bb-ring{transform-origin:150px 170px;animation:bb-spin 14s linear infinite}
@keyframes bb-spin{to{transform:rotate(360deg)}}
#bb-r .bb-k{stroke-dasharray:100 100;animation:bb-k 9s cubic-bezier(.55,0,.2,1) infinite}
@keyframes bb-k{0%{stroke-dashoffset:100}32%,76%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
#bb-r .bb-hit{transform-box:fill-box;transform-origin:center;animation:bb-hit 9s ease-out infinite}
@keyframes bb-hit{0%,30%{transform:scale(.4);opacity:0}33%{opacity:.9}60%,100%{transform:scale(1.5);opacity:0}}
#bb-r .bb-run{animation:bb-run 9s ease-in-out infinite}
@keyframes bb-run{0%,100%{transform:translateX(0);opacity:.2}15%{transform:translateX(10px);opacity:.8}32%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#bb-r,#bb-r *{animation:none!important}}
</style>
<defs>
<radialGradient id="bb-g" cx=".5" cy=".22" r=".62"><stop offset="0" stop-color="#f2cc4b" stop-opacity=".16"/><stop offset="1" stop-color="#f2cc4b" stop-opacity="0"/></radialGradient>
<linearGradient id="bb-f" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0a0b0d" stop-opacity="0"/><stop offset=".7" stop-color="#0a0b0d" stop-opacity=".96"/><stop offset="1" stop-color="#0a0b0d"/></linearGradient>
<linearGradient id="bb-s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="bb-h" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" fill="#fff" fill-opacity=".06"/></pattern>
<clipPath id="bb-c"><rect width="300" height="280"/></clipPath>
<linearGradient id="bb-kg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1e73be" stop-opacity=".15"/><stop offset="1" stop-color="#f2cc4b"/></linearGradient>
</defs>
